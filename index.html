<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1a15">
<meta name="robots" content="noindex, nofollow">
<title>스마트 알림판</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 배치: 교무실 칠판처럼 카드 없이 줄(괘선)로 칸을 나눈다.
   위 = 시계·날짜·날씨 / 틀 안 = 오늘(넓게) | 내일 → 공지 띠 → 급식 | 기도 | 학생현황 / 맨 아래 = 상태 줄.
   1920 × 1080 을 기준으로 그리고 화면 크기에 맞춰 통째로 키우고 줄인다. 아래 px 는 모두 그 기준 값이다. */
:root{
  --board:#0d1a15;                 /* 칠판 */
  --wash:#15291f;                  /* 오늘 칸: 칠판보다 한 톤 밝게 */
  --chalk:#f5f2e8; --chalk-2:#bfcdc3; --chalk-3:#86a092;      /* 분필 흰색 · 흐린 글 · 더 흐린 글 */
  --rule:rgba(245,242,232,.3); --hair:rgba(245,242,232,.11);  /* 칸을 나누는 줄 · 줄 사이 가는 줄 */
  --today:#f7d463;                 /* 노란 분필: 오늘·지금 */
  --notice:#ff9c8a;                /* 공지 */
  --sat:#8fd0ff;
  --ok:#58d39a; --warn:#ffc04d; --err:#ff6b6b;
  --sans:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Nanum Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--board)}
body{font-family:var(--sans);color:var(--chalk);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;user-select:none;-webkit-user-select:none}
body.idle,body.idle *{cursor:none!important}

#fit{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;padding:20px 40px 6px;background:var(--board)}

/* ── 머리: 시계 · 날짜 · 날씨 ─────────────────────── */
.top{flex:none;display:flex;align-items:center;gap:40px;height:132px;padding:0 4px 12px}
.clock{font-size:118px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.clock .c{display:inline-block;margin:0 .02em;transform:translateY(-.07em);animation:blink 2s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:.25}}
.date{font-size:58px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.date .wd{margin-left:.32em;font-weight:700;color:var(--chalk-2)}
.date .wd.sat{color:var(--sat)} .date .wd.sun{color:var(--notice)}
.wx{margin-left:auto;display:flex;align-items:center;gap:18px}
.wxi{width:78px;height:78px;flex:none}
.wx .now{font-size:72px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wx .sub{display:flex;flex-direction:column;font-size:28px;font-weight:700;line-height:1.16;color:var(--chalk-2);white-space:nowrap}
.wx .sub b{font-weight:800;color:var(--chalk)}

/* ── 틀: 줄로 나눈 칸들 ───────────────────────────── */
.frame{flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden;border:2px solid var(--rule);border-radius:6px}

/* ── 일과 줄: 1~7교시와 점심을 시간 길이대로 늘어놓고 지금 자리를 표시한다 ── */
.bells{flex:none;position:relative;display:flex;height:56px;border-bottom:2px solid var(--rule)}
.bell{flex:1 0 0;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:10px;overflow:hidden;white-space:nowrap;line-height:56px;border-left:1px solid var(--hair)}
.bell:first-child{border-left:0}
.bell b{font-size:26px;font-weight:800}
.bell span{font-size:21px;font-weight:700;color:var(--chalk-3);font-variant-numeric:tabular-nums}
.bell.gap{background:rgba(0,0,0,.22)}
.bell.rest b{font-weight:700;color:var(--chalk-2)}
.bell.past{opacity:.38}
.bell.now{background:linear-gradient(#221a00,#221a00) left bottom / var(--p,0%) 7px no-repeat,var(--today)}   /* 아래 검은 줄 = 지나간 만큼 */
.bell.now b,.bell.now span{color:#221a00}
.bell.soon{box-shadow:inset 0 0 0 3px var(--today)}
.bell.soon span{color:var(--today)}
#stage.worship-on .bells{display:none}

/* ── 오늘 · 내일 ──────────────────────────────────── */
.days{flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr)}
.day{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;padding:14px 30px 6px}
.day + .day{border-left:2px solid var(--rule)}
.day.today{background:var(--wash)}
.day-h{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 18px;min-height:80px;padding-bottom:6px;border-bottom:2px solid var(--hair)}
.dl{display:flex;align-items:baseline;gap:16px;min-width:0}
.dl b{font-size:62px;font-weight:900;line-height:1.15;color:var(--today);white-space:nowrap}
.day.next .dl b{font-size:48px;font-weight:800;color:var(--chalk)}
.dl span{font-size:36px;font-weight:700;color:var(--chalk-2);white-space:nowrap}
.dl em{font-style:normal;font-size:24px;font-weight:700;color:var(--chalk-3);border:1.5px solid var(--hair);border-radius:999px;padding:2px 14px;white-space:nowrap;align-self:center}
.hd-r{display:flex;align-items:baseline;gap:18px;flex:none}
.night{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.night i{font-style:normal;font-size:25px;font-weight:700;color:var(--chalk-3)}
.night b{font-size:44px;font-weight:800}
.day.next .night b{font-size:38px}
.night.off b{font-size:32px;font-weight:700;color:var(--chalk-3)}
.pg{font-size:26px;font-weight:800;color:var(--today);font-variant-numeric:tabular-nums}
.pg:empty{display:none}

/* ── 일정 줄 ──────────────────────────────────────── */
.list{list-style:none;flex:1 1 0;min-height:0;overflow:hidden;font-size:var(--fs,54px);padding-top:4px}
.list.flip{animation:flip .45s ease-out}
@keyframes flip{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ev{display:flex;align-items:baseline;gap:.42em;padding:.2em 0;border-bottom:1px solid var(--hair);line-height:1.24}
.ev:last-child{border-bottom:0}
.ev.past{opacity:.4}                                   /* 교시가 이미 끝난 일정 */
.tg.now{background:var(--today);color:#221a00}         /* 지금 그 교시 */
.cb{flex:none;width:max(2.6em,116px)}                 /* 칩이 들어가는 칸: 부서 이름이 길든 짧든 폭이 같다 */
.chip{
  display:block;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:max(.56em,26px);font-weight:800;line-height:1.3;padding:.16em .1em;border-radius:.3em;
  background:hsl(var(--dh) calc(var(--ds) + 24%) 80%);color:hsl(var(--dh) 55% 13%);
}
.chip.l5{font-size:max(.46em,21px)}
.chip.l6{font-size:max(.39em,18px)}
.chip.l7{font-size:max(.33em,16px)}
.body{flex:1;min-width:0;font-weight:700;letter-spacing:-.012em;word-break:keep-all;overflow-wrap:anywhere}
.tg{
  display:inline-block;font-style:normal;font-size:max(.5em,23px);font-weight:700;line-height:1.25;
  padding:.06em .5em;margin-left:.45em;border-radius:.3em;white-space:nowrap;vertical-align:.16em;
  background:rgba(245,242,232,.13);color:var(--chalk-2);
}
.nw{white-space:nowrap}
.tg.cat{background:transparent;border:1.5px solid rgba(245,242,232,.32);color:var(--chalk-3)}
.empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;text-align:center;font-size:.72em;font-weight:600;color:var(--chalk-3);border:0!important}

/* ── 공지 띠 (있을 때만) ──────────────────────────── */
.notices{flex:none;display:flex;align-items:center;gap:24px;padding:12px 30px;border-top:2px solid var(--rule);background:rgba(255,156,138,.14)}
.notices .nl{flex:none;font-size:30px;font-weight:900;color:#3a0f08;background:var(--notice);border-radius:6px;padding:.12em .6em}
.notices .list{flex:1;max-height:116px;padding-top:0;font-size:var(--fs,44px)}
.nt{position:relative;padding:.08em 0 .08em .7em;font-weight:800;line-height:1.24;word-break:keep-all;overflow-wrap:anywhere}
.nt::before{content:"";position:absolute;left:0;top:.62em;width:.28em;height:.28em;border-radius:50%;background:var(--notice)}
.notices .pg{color:var(--notice)}

/* ── 아래 줄: 급식 · 기도 · 학생현황 (늘 보인다) ───── */
.info{flex:none;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.25fr) minmax(0,1fr);height:182px;border-top:2px solid var(--rule)}
.cell{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;overflow:hidden;padding:12px 28px 14px}
.cell + .cell{border-left:2px solid var(--rule)}
.cell h3{flex:none;display:flex;align-items:baseline;gap:14px;font-size:26px;font-weight:800;letter-spacing:.04em;line-height:1.2;color:var(--chalk-3);white-space:nowrap}
.cell h3 .sp{flex:1}
.cell h3 > b{font-size:36px;font-weight:900;letter-spacing:0;line-height:1;color:var(--chalk)}
/* 급식: 다가오는 끼니만. 중식·석식이 둘 다 남았으면 번갈아 보이고, 어느 쪽인지는 이름표로 알린다 */
.tabs{display:flex;gap:18px}
.tab{font-size:32px;font-weight:800;letter-spacing:0;line-height:1.12;color:var(--chalk-3);opacity:.55;border-bottom:4px solid transparent;transition:opacity .4s ease,border-color .4s ease}
.tab.on{color:var(--chalk);opacity:1;border-bottom-color:var(--today)}
.kcal{font-size:26px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.menus{flex:1 1 0;min-height:0;overflow:hidden;display:grid;grid-template:minmax(0,1fr) / minmax(0,1fr)}
.menus > *{grid-area:1 / 1;min-height:0}
.menu{overflow:hidden;margin-left:-.9em;font-size:var(--fs,40px);font-weight:700;line-height:1.28;word-break:keep-all;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s .5s}
.menu.on{opacity:1;visibility:visible;transition:opacity .5s ease}
.dish{display:inline-block;position:relative;padding-left:.9em}                 /* 가운뎃점은 음식 앞에 찍고, 줄 맨 앞의 점은 칸 밖으로 밀려 잘린다 */
.dish::before{content:"";position:absolute;left:.36em;top:.56em;width:.16em;height:.16em;border-radius:50%;background:var(--chalk-3)}
.none{align-self:center;margin-left:0;font-size:30px;font-weight:600;color:var(--chalk-3)}
/* 기도: 이번 주 다섯 날 + 오늘 찬송·성경 */
.dv{min-width:0;overflow:hidden;font-size:30px;font-weight:700;letter-spacing:0;color:var(--chalk-2)}
.dv b{font-weight:800;color:var(--chalk)}
.week{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wk{display:flex;flex-direction:column;justify-content:center;min-width:0;text-align:center;border-radius:6px;background:rgba(245,242,232,.055)}
.wk .d{display:block;font-size:24px;font-weight:700;color:var(--chalk-3);white-space:nowrap}
.wk .n{display:block;font-size:44px;font-weight:800;line-height:1.22;white-space:nowrap;overflow:hidden}
.wk.past{opacity:.45}
.wk.now{background:var(--today)}
.wk.now .d{color:#6d5200} .wk.now .n{color:#221a00}
.wk .n.nil{color:var(--chalk-3);font-weight:600}
/* 학생현황: 학년 × 반 표 */
#stuRows{flex:1 1 0;min-height:0;display:grid;grid-template-columns:auto repeat(var(--n,6),minmax(0,1fr)) auto;align-content:space-around;align-items:baseline;column-gap:6px;font-variant-numeric:tabular-nums}
#stuRows .g{font-size:27px;font-weight:700;color:var(--chalk-3);white-space:nowrap;padding-right:10px}
#stuRows .c{font-size:min(27px,calc(180px / var(--n,6)));font-weight:600;color:var(--chalk-2);text-align:right}
#stuRows b{font-size:34px;font-weight:800;line-height:1;text-align:right;padding-left:14px}

/* ── 아침 예배(7:50~7:55): 그 시간에만 찬송·성경이 틀을 가득 채운다 ── */
.worship{display:none;flex:1 1 0;min-height:0;flex-direction:column;justify-content:center;gap:20px;overflow:hidden;padding:22px 48px 28px;background:var(--wash)}
.wh{display:flex;align-items:baseline;gap:28px;padding-bottom:12px;border-bottom:2px solid var(--hair)}
.wh b{font-size:60px;font-weight:900;color:var(--today)}
.wh span{font-size:38px;font-weight:700;color:var(--chalk-2);font-variant-numeric:tabular-nums}
.wh .wp{margin-left:auto;font-size:54px;font-weight:800;color:var(--chalk-2)}
.wh .wp strong{margin-left:.35em;font-weight:900;color:var(--chalk)}
.wb{flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-rows:minmax(0,1fr);align-items:stretch}
.wb.one{grid-template-columns:minmax(0,1fr)}
.wb.txt{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.wcol{min-width:0;min-height:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr;padding:0 34px;text-align:center}
.wcol:first-child{padding-left:0} .wcol:last-child{padding-right:0}
.wcol + .wcol{border-left:2px solid var(--rule)}
.wcol i{display:block;font-style:normal;font-size:56px;font-weight:800;color:var(--chalk-3);letter-spacing:.1em}
.wcol b{display:block;align-self:center;font-weight:900;line-height:1.14;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.wcol .wtext,.wcol .pg{display:none}
.wcol.has-text{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:22px;align-items:center;text-align:left}
.wcol.has-text i{font-size:50px}
.wcol.has-text b{text-align:left}
.wcol.has-text .pg{display:block;font-size:32px}
.wcol.has-text .wtext{display:block;grid-column:1 / -1;align-self:stretch;margin-top:8px;padding:12px 0 0;border-top:2px solid var(--hair);font-size:var(--fs,48px);line-height:1.34}
.wtext .vs{padding:.12em 0;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.wtext .vs.n{padding-left:1.08em;text-indent:-1.08em}
.wtext .vn{display:inline-block;width:1.5em;margin-right:.3em;text-indent:0;font-size:.6em;font-weight:900;color:var(--today);vertical-align:.22em}
#stage.worship-on .days,#stage.worship-on .notices,#stage.worship-on .info{display:none}
#stage.worship-on .worship{display:flex}

/* ── 맨 아래 줄 · 안내 층 ─────────────────────────── */
.status{flex:none;height:36px;display:flex;align-items:center;gap:14px;padding:0 4px;font-size:21px;font-weight:600;color:var(--chalk-3);white-space:nowrap;overflow:hidden}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
.status .sp{flex:1}
#schoolCode{font-variant-numeric:tabular-nums;letter-spacing:.04em}
#schoolCode:empty{display:none}
.status .cr{min-width:0;overflow:hidden;text-overflow:ellipsis}
.status button{font:inherit;font-weight:700;color:var(--chalk);background:rgba(245,242,232,.1);border:1.5px solid var(--rule);border-radius:999px;padding:1px 16px;cursor:pointer}
.status button:hover{background:rgba(245,242,232,.18)}
.status button:focus-visible{outline:3px solid var(--today);outline-offset:2px}
.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:80px;text-align:center;background:rgba(13,26,21,.95)}
.overlay b{font-size:64px;font-weight:900}
.overlay p{font-size:36px;font-weight:600;color:var(--chalk-2);line-height:1.4;max-width:1400px;word-break:keep-all}
.overlay small{font-size:28px;color:var(--chalk-3);max-width:1500px;word-break:break-all}

@media (prefers-reduced-motion:reduce){
  .clock .c,.list.flip{animation:none}
  .menu,.menu.on,.tab{transition:none}
}
</style>
</head>

<div id="fit">
<div id="stage">
  <header class="top">
    <div class="clock" id="clock" aria-label="현재 시각"><span id="hh">--</span><span class="c">:</span><span id="mm">--</span></div>
    <div class="date"><span id="dmd">-</span><span class="wd" id="dwd"></span></div>
    <div class="wx" id="wx" hidden>
      <svg class="wxi" viewBox="0 0 64 64" aria-hidden="true"><use id="wxUse" href="#wx-sun"/></svg>
      <b class="now" id="wxNow"></b>
      <div class="sub"><b id="wxCond"></b><span id="wxRange"></span><span id="wxPop"></span></div>
    </div>
  </header>

  <div class="frame">
    <section class="worship" id="worship">
      <div class="wh"><b>아침 예배</b><span id="wTime"></span><span class="wp" id="w-pray" hidden>기도<strong></strong></span></div>
      <div class="wb" id="wBody">

<script>

/*

/* ============ 설정 ============ */
/* 시트(또는 시트 소유 계정)가 바뀌면 이 ID 만 고치면 된다. 탭은 이름으로 읽으므로 탭 이름도 같아야 한다. */
const SHEET_ID = "1qg5vX4KlrI3hwn1XLiLIupkO74zxleqV6Imk1y5YQIE";
const TABS = [
  { key:"plan",   sheet:"연중행사계획", name:"학사일정" },

const WORSHIP = { from:"07:50", to:"07:55", days:[1, 2, 3, 4, 5] };
const WEATHER = { on:true, lat:37.5665, lon:126.9780, every:30 * 60e3, stale:3 * 3600e3 };

const SCHOOL = { name:"보성여자고등학교", office:"B10", code:"B100000447" };
/* 한 시간마다 새로 받는다. 중식·석식이 둘 다 남아 있으면 급식 칸에서 rotate 마다 번갈아 보인다.
   lunchEnd 가 지나면 오늘 중식을, dinnerEnd 가 지나면 오늘 석식을 내리고 다음 급식일 것을 보인다. */
const MEAL = { on:true, every:60 * 60e3, rotate:8e3, lunchEnd:"12:00", dinnerEnd:"19:00" };
/* 일과 시각표: [이름, 시작, 끝]. 이름이 숫자로 시작하면 그 교시로 보고 일정의 "3교시" 표시와 맞춘다. 요일은 0=일 … 6=토.
   from 부터 마지막 칸이 끝날 때까지 일과 줄을 보인다. 시각이 바뀌면 여기만 고친다. */
const BELLS = { days:[1, 2, 3, 4, 5], from:"07:00", rows:[
  ["1교시", "08:10", "09:00"], ["2교시", "09:10", "10:00"], ["3교시", "10:10", "11:00"], ["점심", "11:00", "12:00"],
  ["4교시", "12:00", "12:50"], ["5교시", "13:00", "13:50"], ["6교시", "14:00", "14:50"], ["7교시", "15:00", "15:50"]
] };
const POLL_MS = 5 * 60e3, RETRY_MS = [15e3, 30e3, 60e3], TIMEOUT_MS = 15e3;
const PAGE_MS = 9e3, STALE_MS = 15 * 60e3;
const CACHE_KEY = "board:cache:v1";

/* 부서 — [이름, 색상, 채도]. 학사일정 앱과 같은 색을 써서 두 화면의 부서 색이 같다. */
const DEPTS = [
  ["교목부",292,40],["교무부",220,44],["연구부",232,42],["상담부",320,38],["정보부",244,40],
  ["1학년부",16,52],["2학년부",30,54],["3학년부",44,54],["기획위원",254,38],["행정실",210,26],
  ["국어과",108,40],["영어과",124,38],["수학과",160,42],["사회과",138,36],["과학과",172,42],
  ["예체능과",184,40],["정보과",196,42],["외국어과",66,46],["기타",212,7]
];
const TONE = new Map(DEPTS.map(([n, h, s]) => [n, `--dh:${h};--ds:${s}%`]));
const tone = d => TONE.get(d) || TONE.get("기타");

/* ============ 유틸 ============ */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const WD = ["일","월","화","수","목","금","토"];
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parts = k => k.split("-").map(Number);
const utc = k => { const [y, m, d] = parts(k); return Date.UTC(y, m - 1, d); };
const addDays = (k, n) => new Date(utc(k) + n * 864e5).toISOString().slice(0, 10);
const dowOf = k => new Date(utc(k)).getUTCDay();
const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const mdOf = k => { const [, m, d] = parts(k); return `${m}/${d}`; };
const el = (tag, cls, ...kids) => {
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  for(const k of kids){
    if(k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch{ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};

/* 시각은 어느 컴퓨터에서 열어도 한국 시간으로 본다 */
const kstFmt = new Intl.DateTimeFormat("en-GB", {
  timeZone:TZ, hourCycle:"h23", year:"numeric", month:"2-digit", day:"2-digit",
  hour:"2-digit", minute:"2-digit", second:"2-digit"
});
function kstParts(ms){
  const p = {};
  for(const x of kstFmt.formatToParts(ms == null ? new Date() : new Date(ms))) p[x.type] = x.value;
  return { y:+p.year, m:+p.month, d:+p.day, hh:+p.hour, mm:+p.minute, ss:+p.second };
}
const Q = new URLSearchParams(location.search);
const FAKE = {
  date: /^\d{4}-\d{2}-\d{2}$/.test(Q.get("date") || "") ? Q.get("date") : null,
  time: /^\d{1,2}:\d{2}$/.test(Q.get("time") || "") ? Q.get("time") : null
};
function now(){
  const n = kstParts();
  if(FAKE.date) [n.y, n.m, n.d] = parts(FAKE.date);
  if(FAKE.time){ [n.hh, n.mm] = FAKE.time.split(":").map(Number); n.ss = 0; }
  n.key = ymd(n.y, n.m, n.d);
  return n;
}
const hymnText = h => /^\d{1,3}$/.test(h) ? `${h}장` : (h || "");
const toMin = v => { const [h, m] = v.split(":").map(Number); return h * 60 + m; };
let forceWorship = Q.has("worship");          /* W 키(또는 예시 화면의 단추)로도 켜고 끈다 */
function worshipNow(n){
  if(forceWorship) return true;
  const m = n.hh * 60 + n.mm;
  return WORSHIP.days.includes(dowOf(n.key)) && m >= toMin(WORSHIP.from) && m <= toMin(WORSHIP.to);
}
/* 일과가 지금 어디쯤인지. cur = 진행 중인 칸, soon = 곧 시작할 칸(쉬는 시간·등교 전), no = 지금 교시 번호, done = 끝난 마지막 교시 번호 */
const BELL = BELLS.rows.map(([name, a, b]) => ({ name, a:toMin(a), b:toMin(b), no:/^\d/.test(name) ? parseInt(name, 10) : 0 }));
function bellNow(n){
  if(!BELL.length || !BELLS.days.includes(dowOf(n.key))) return null;
  const m = n.hh * 60 + n.mm;
  const cur = BELL.findIndex(x => m >= x.a && m < x.b);
  return {
    m, cur, soon:cur < 0 ? BELL.findIndex(x => m < x.a) : -1,
    no:cur >= 0 ? BELL[cur].no : 0,
    done:Math.max(0, ...BELL.filter(x => x.no && m >= x.b).map(x => x.no)),
    show:m >= toMin(BELLS.from) && m < BELL[BELL.length - 1].b
  };
}
const schoolYear = () => { const n = kstParts(); return n.m >= 3 ? n.y : n.y - 1; };
const clockOf = ms => { const p = kstParts(ms); return `${pad(p.hh)}:${pad(p.mm)}`; };

/* ============ 시트 읽기 (gviz JSONP) ============ */
let seq = 0;
function gviz(sheet, tq){
  return new Promise((resolve, reject) => {
    const cb = `__board${++seq}_${Date.now().toString(36)}`;
    const s = document.createElement("script");
    let done = false;
    const finish = (err, val) => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      window[cb] = () => {};
      setTimeout(() => { delete window[cb]; }, 60e3);
      s.remove();
      err ? reject(err) : resolve(val);
    };
    const timer = setTimeout(() => finish(new Error("응답 시간 초과")), TIMEOUT_MS);
    window[cb] = res => {
      if(!res || res.status === "error"){
        const e = res && res.errors && res.errors[0];
        const msg = e && (e.detailed_message || e.message || e.reason);
        finish(new Error(msg ? String(msg).replace(/<[^>]*>/g, "") : "시트가 오류를 돌려주었습니다"));
        return;
      }
      const t = res.table;
      if(!t || !Array.isArray(t.rows) || !Array.isArray(t.cols)){ finish(new Error("표 형식이 아닙니다")); return; }
      finish(null, t);
    };
    s.onerror = () => finish(new Error("연결하지 못했습니다"));
    /* 비공개 시트는 로그인 페이지를 돌려줘 콜백이 불리지 않는다 */
    s.onload = () => setTimeout(() => finish(new Error("시트를 읽을 수 없습니다 (공유 설정 확인)")), 50);
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}`
      + `&sheet=${encodeURIComponent(sheet)}` + (tq ? `&tq=${encodeURIComponent(tq)}` : "") + `&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}

/* ============ 셀 해석 ============ */
const cText = c => !c ? "" : (c.f != null && c.f !== "") ? String(c.f).trim() : (c.v == null ? "" : String(c.v).trim());
const valid = (y, m, d) => {
  if(!(y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  return new Date(y, m - 1, d).getMonth() === m - 1 ? ymd(y, m, d) : null;
};
/* MM-DD 로만 적힌 날짜의 연도: 12월 → 1월로 넘어가면 해를 올린다 */
function yearCursor(start){
  let year = start, last = 0;
  return {
    year(m){ if(last && m < last && last - m >= 6) year++; last = m; return year; },
    seen(m, y){ year = y; last = m; }
  };
}
function cellDate(c, cur){
  if(!c) return null;
  if(typeof c.v === "string"){
    const g = c.v.match(/^Date\((\d+),\s*(\d+),\s*(\d+)/);
    if(g){ if(cur) cur.seen(+g[2] + 1, +g[1]); return valid(+g[1], +g[2] + 1, +g[3]); }
  }
  const t = cText(c);
  let m = t.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if(m){ if(cur) cur.seen(+m[2], +m[1]); return valid(+m[1], +m[2], +m[3]); }
  m = t.match(/^(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?$/);
  if(m && cur) return valid(cur.year(+m[1]), +m[1], +m[2]);
  return null;
}
/* 머리글 줄을 찾아 열 위치를 정한다. 못 찾으면 시트의 현재 배치를 쓴다. */
function columns(table, fallback){
  const names = Object.keys(fallback), out = { ...fallback };
  for(const r of table.rows.slice(0, 8)){
    const t = (r.c || []).map(cText);
    if(names.filter(n => t.includes(n)).length >= Math.min(2, names.length)){
      names.forEach(n => { const i = t.indexOf(n); if(i >= 0) out[n] = i; });
      return out;
    }
  }
  const labels = (table.cols || []).map(c => String(c.label || "").trim().split(/\s+/).pop());
  names.forEach(n => { const i = labels.indexOf(n); if(i >= 0) out[n] = i; });
  return out;
}

/* ============ 일정 한 줄 해석 ============ */
const CIRCLED = { "①":1, "②":2, "③":3 };
/* "[교무부]개학식(②③,1) [교무부]입학식(①,2시)" → 줄 단위, 한 줄에 [부서]가 여럿이면 갈라서 */
function splitCell(text){
  const out = [];
  for(const line of String(text || "").replace(/\r/g, "").split("\n")){
    for(const piece of line.split(/\s+(?=\[[^\[\]]{1,20}\])/)){
      const s = piece.trim();
      if(!s || s === "null") continue;
      if(s.startsWith("[") || !out.length) out.push(s);
      else out[out.length - 1] += " " + s;
    }
  }
  return out;
}
const circledGrades = s => [...new Set([...s].map(ch => CIRCLED[ch]).filter(Boolean))].sort();
const PERIOD_TOKEN = /^(\d)\s*(?:[~\-–]\s*(\d))?\s*(?:교시)?$/;
const RANGE_TOKEN = /^~\s*\d{1,2}(?:\s*[\/.]\s*\d{1,2})?\s*일?$/;
function findPeriods(s){
  const set = new Set();
  const add = (a, b) => { a = +a; b = b ? +b : a; if(a < 1 || b > 9 || b < a) return; for(let k = a; k <= b; k++) set.add(k); };
  for(const m of s.matchAll(/(\d)\s*(?:[~\-–]\s*(\d)\s*)?교시/g)) add(m[1], m[2]);
  for(const g of s.matchAll(/\(([^()]*)\)/g)){
    for(const tok of g[1].split(/[,，]/)){
      const m = tok.replace(/[①②③]/g, "").trim().match(PERIOD_TOKEN);
      if(m) add(m[1], m[2]);
    }
  }
  return [...set].sort((a, b) => a - b);
}
/* "(~3/11)", "(②, ~13일)" 처럼 끝나는 날이 적힌 일정 */
function findEnd(s, start){
  const [sy, sm, sd] = parts(start);
  let y = sy, mo, d;
  let m = s.match(/~\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})/);
  if(m){
    mo = +m[1]; d = +m[2];
    if(mo < sm && sm - mo >= 6) y++;
  }else{
    m = null;
    for(const x of s.matchAll(/~\s*(\d{1,2})\s*일?(?=\s*[),]|\s*$)/g)){
      if(/\d\s*$/.test(s.slice(0, x.index))) continue;     /* "1~3" 처럼 숫자 바로 뒤의 ~ 는 범위다 */
      m = x; break;
    }
    if(!m) return null;
    mo = sm; d = +m[1];
    if(d < sd){ mo++; if(mo > 12){ mo = 1; y++; } }
  }
  const k = valid(y, mo, d);
  return k && k > start ? k : null;
}
/* 학년·교시·기간만 담긴 괄호는 태그로 따로 보이므로 본문에서 뺀다 */
function cleanText(s){
  return s.replace(/\s*\(([^()]*)\)/g, (all, inner) => {
    const toks = inner.split(/[,，]/).map(t => t.trim()).filter(Boolean);
    const rest = toks.filter(t => {
      const x = t.replace(/[①②③]/g, "").trim();
      return !(x === "" || PERIOD_TOKEN.test(x) || RANGE_TOKEN.test(x));
    });
    if(rest.length === toks.length) return all;
    return rest.length ? `(${rest.join(", ")})` : "";
  }).replace(/\s{2,}/g, " ").trim();
}
function parseItem(src, date){
  let s = src.trim(), dept = "", cat = "";
  let m = s.match(/^\[([^\]]{1,20})\]\s*/);
  if(m){ dept = m[1].trim(); s = s.slice(m[0].length); }
  m = s.match(/^<([^>]{1,10})>\s*/);
  if(m){ cat = m[1].trim(); s = s.slice(m[0].length); }
  return { dept, cat, text:cleanText(s) || s, grades:circledGrades(s), periods:findPeriods(s), until:findEnd(s, date) };
}

/* ============ 시트별 해석 ============ */
function parsePlan(t){
  const h = columns(t, { "날짜":0, "요일":1, "일정":2 });
  const byDate = {}, dates = new Set();
  for(const r of t.rows){
    const c = r.c || [];
    const date = cellDate(c[h["날짜"]]);
    if(!date) continue;
    dates.add(date);
    const items = splitCell(cText(c[h["일정"]])).map(s => parseItem(s, date)).filter(it => it.text && it.text !== "null");
    if(items.length) (byDate[date] = byDate[date] || []).push(...items);
  }
  if(!dates.size) throw new Error("날짜가 적힌 줄을 찾지 못했습니다");
  return { byDate, dates:[...dates].sort() };
}
function parseNotice(t){
  const h = columns(t, { "게시 시작일":0, "게시 종료일":1, "내용":2 });
  const out = [];
  for(const r of t.rows){
    const c = r.c || [];
    const text = cText(c[h["내용"]]);
    if(!text || text === "null") continue;
    const rawFrom = cText(c[h["게시 시작일"]]), rawTo = cText(c[h["게시 종료일"]]);
    const from = cellDate(c[h["게시 시작일"]]), to = cellDate(c[h["게시 종료일"]]);
    if((rawFrom && !from) || (rawTo && !to)) continue;      /* 기간을 못 읽는 줄은 싣지 않는다 */
    if(from && to && from > to) continue;
    out.push({ from, to, text });
  }
  return out;
}
function parsePray(t){
  const h = columns(t, { "날짜":0, "요일":1, "이름":2, "성경":3, "찬송":4 });
  const cur = yearCursor(schoolYear()), out = {};
  for(const r of t.rows){
    const c = r.c || [];
    const date = cellDate(c[h["날짜"]], cur);
    if(!date) continue;
    const p = { name:cText(c[h["이름"]]), bible:cText(c[h["성경"]]), hymn:cText(c[h["찬송"]]) };
    if(p.name || p.bible || p.hymn) out[date] = p;
  }
  return out;
}
function parseNight(t){
  const h = columns(t, { "날짜":0, "요일":1, "이름":2 });
  const cur = yearCursor(schoolYear()), out = {};
  for(const r of t.rows){
    const c = r.c || [];
    const date = cellDate(c[h["날짜"]], cur), name = cText(c[h["이름"]]);
    if(date && name) out[date] = name;
  }
  return out;
}
/* 학생현황: 학년마다 [학급 · 담임 · 학생수] 세 칸. 머리글이 열 이름으로 합쳐져 오든 첫 줄로 오든 읽는다. */
function parseRoster(t){
  const last = x => String(x || "").trim().split(/\s+/).pop();
  const grid = [(t.cols || []).map(c => last(c.label)), ...t.rows.map(r => (r.c || []).map(cText))];
  let hr = -1, cnt = [];
  for(let i = 0; i < Math.min(grid.length, 8); i++){
    const idx = grid[i].map((v, j) => last(v) === "학생수" ? j : -1).filter(j => j >= 0);
    if(idx.length){ hr = i; cnt = idx; break; }
  }
  if(hr < 0) throw new Error("학생수 칸을 찾지 못했습니다");
  const body = hr === 0 ? t.rows : t.rows.slice(hr);
  const grades = cnt.slice(0, 3).map((col, k) => {
    const cls = col - 2;
    const classes = [];
    for(const r of body){
      const c = r.c || [];
      const n = c[col] && typeof c[col].v === "number" ? c[col].v : parseInt(cText(c[col]), 10);
      const no = c[cls] && typeof c[cls].v === "number" ? c[cls].v : parseInt(cText(c[cls]), 10);
      if(Number.isInteger(n) && n > 0 && Number.isInteger(no) && no > 0) classes.push({ c:no, n });
    }
    return { g:k + 1, classes, total:classes.reduce((a, x) => a + x.n, 0) };
  }).filter(x => x.classes.length);
  if(!grades.length) throw new Error("학급별 학생 수를 읽지 못했습니다");
  return { grades, total:grades.reduce((a, x) => a + x.total, 0) };
}
const PARSERS = { plan:parsePlan, notice:parseNotice, pray:parsePray, night:parseNight, roster:parseRoster };

/* ============ 상태 · 저장본 ============ */
const state = { data:{ plan:null, notice:null, pray:null, night:null, roster:null }, src:{}, loadedAt:0, demo:false, tried:false, wx:null };
for(const t of TABS) state.src[t.key] = { at:0, error:"" };

/* ============ 오늘 · 내일 계산 ============ */
const nextWeekday = k => { let d = addDays(k, 1); while([0, 6].includes(dowOf(d))) d = addDays(d, 1); return d; };

/* 같은 부서·같은 이름의 일정은 한 줄로 묶고, 학년·교시만 태그로 나열한다 */
function groupItems(items){
  const out = [], idx = new Map();
  for(const it of items){
    const k = itemKey(it);
    let g = idx.get(k);
    if(!g){ g = { dept:it.dept, cat:it.cat, text:it.text, vars:[] }; idx.set(k, g); out.push(g); }
    const v = { grades:it.grades, periods:it.periods, until:it.until };
    const vk = JSON.stringify(v);
    if(!g.vars.some(x => JSON.stringify(x) === vk)) g.vars.push(v);
  }
  return out;
}
function periodLabel(ps){
  const a = [...ps].sort((x, y) => x - y);
  const run = a.length > 1 && a.every((v, i) => i === 0 || v === a[i - 1] + 1);
  return run ? `${a[0]}~${a[a.length - 1]}교시` : `${a.join("·")}교시`;
}
function varLabel(v){
  const out = [];
  if(v.grades.length) out.push(v.grades.length === 3 ? "전학년" : `${v.grades.join("·")}학년`);
  if(v.periods.length) out.push(periodLabel(v.periods));
  if(v.until) out.push(`~${mdOf(v.until)}`);
  return out.join(" ");
}

/* "(~13일)" 처럼 끝나는 날이 적힌 일정은 시작한 날에만 적혀 있어도 끝나는 날까지 날마다 보인다.
   그날 칸에 같은 부서·같은 이름의 일정이 이미 적혀 있으면 겹쳐 싣지 않는다. */
const CARRY_DAYS = 45;
const itemKey = it => [it.dept, it.cat, it.text].join("\u0001");
function itemsOn(plan, k){
  const by = plan.byDate || {}, own = by[k] || [], out = [...own];
  const seen = new Set(own.map(itemKey)), from = addDays(k, -CARRY_DAYS);
  for(const d of Object.keys(by).sort()){
    if(d < from || d >= k) continue;
    for(const it of by[d]){
      if(!it.until || it.until < k || seen.has(itemKey(it))) continue;
      seen.add(itemKey(it)); out.push(it);
    }
  }
  return out;
}

function dayView(k, label, plan, extra){
  return {
    key:k, label,
    sub:extra ? mdOf(k) : `${mdOf(k)} (${WD[dowOf(k)]})`,
    tag:extra || "",
    groups:groupItems(itemsOn(plan, k)),
    night:(state.data.night && state.data.night[k]) || ""
  };
}

function buildView(n){
  const t = n.key, D = state.data;
  const plan = D.plan || { byDate:{}, dates:[] };
  const dset = new Set(plan.dates);
  let nx = addDays(t, 1);
  if(!dset.has(nx)){
    const later = plan.dates.find(k => k > t);
    nx = later && diffDays(t, later) <= 10 ? later : nextWeekday(t);
  }
  const tomorrow = nx === addDays(t, 1);
  const today = dayView(t, "오늘", plan);
  const bn = bellNow(n);
  today.bell = bn ? { no:bn.no, done:bn.done } : null;        /* 교시가 바뀌면 오늘 칸을 다시 그린다 */
  const next = dayView(nx, tomorrow ? "내일" : `${WD[dowOf(nx)]}요일`, plan, tomorrow ? "" : "다음 등교일");

  const notices = (D.notice || []).filter(x => (!x.from || t >= x.from) && (!x.to || t <= x.to));

  /* 이번 주 월~금. 주말이면 다가오는 주를 보여 준다 */
  const dow = dowOf(t);
  const mon = dow === 0 ? addDays(t, 1) : dow === 6 ? addDays(t, 2) : addDays(t, 1 - dow);
  const week = [0, 1, 2, 3, 4].map(i => {
    const k = addDays(mon, i);
    const p = D.pray && D.pray[k];
    return { key:k, wd:WD[dowOf(k)], md:mdOf(k).replace("/", "."), name:(p && p.name) || "", st:k < t ? "past" : k === t ? "now" : "future" };
  });
  const p = D.pray && D.pray[t];
  return {
    today, next, notices, week,
    weekTitle:dow === 0 || dow === 6 ? "다음 주 기도" : "이번 주 기도",
    pray:p || null,
    worship:worshipNow(n) && p && (p.hymn || p.bible)
      ? { hymn:p.hymn || "", bible:p.bible || "", name:p.name || "",
          lyrics:(words[wordKey(p)] && words[wordKey(p)].lyrics) || [], verses:(words[wordKey(p)] && words[wordKey(p)].verses) || [] }
      : null,
    roster:D.roster
  };
}

const pagers = new Map();
const changed = (k, v) => { const s = JSON.stringify(v); if(last[k] === s) return false; last[k] = s; return true; };

function evRow(g, bell){
  const li = el("li", "ev");
  const ps = bell ? [...new Set(g.vars.flatMap(v => v.periods))] : [];
  if(ps.length && !ps.includes(bell.no) && Math.max(...ps) <= bell.done) li.classList.add("past");
  const name = g.dept || "기타";
  const chip = el("span", "chip" + (name.length >= 7 ? " l7" : name.length === 6 ? " l6" : name.length === 5 ? " l5" : ""), name);
  chip.style.cssText = tone(g.dept);
  const body = el("span", "body");
  if(g.cat) body.append(el("i", "tg cat", g.cat), " ");
  const tags = [], seen = new Set();
  for(const v of g.vars){
    const l = varLabel(v);
    if(l && !seen.has(l)){ seen.add(l); tags.push(el("i", "tg" + (bell && bell.no && v.periods.includes(bell.no) ? " now" : ""), l)); }
  }
  /* 태그가 혼자 다음 줄로 떨어지지 않게 마지막 낱말과 첫 태그를 한 덩어리로 묶는다 */
  const m = g.text.match(/^([\s\S]*\s)?(\S+)$/);
  if(m && m[2].length <= 7 && tags.length){
    body.append(m[1] || "", el("span", "nw", m[2], tags.shift()));
  }else body.append(g.text);
  for(const t of tags) body.append(t);
  li.append(el("span", "cb", chip), body);
  return li;
}

/* ── 글자 크기 맞추기: 넘치면 줄이고, 그래도 넘치면 쪽으로 나눠 돌려 보인다 ── */
/* 넘치지 않는 가장 큰 글자 크기 (하나도 안 맞으면 min, 안 보이는 칸이면 null) */
function bestSize(listEl, max, min){
  for(const li of listEl.children) li.hidden = false;
  if(listEl.clientHeight < 40) return null;
  const set = px => listEl.style.setProperty("--fs", px + "px");
  const over = () => listEl.scrollHeight > listEl.clientHeight + 1;
  set(max);
  if(!over()) return max;
  set(min);
  if(over()) return min;
  let lo = min, hi = max;
  while(hi - lo > 1){ const mid = (lo + hi) >> 1; set(mid); if(over()) hi = mid; else lo = mid; }
  return lo;
}
/* 정한 크기로 칸을 채우고, min 에서도 넘치면 쪽으로 나눠 돌려 보인다 */
function applyFit(listEl, fs, noPage){
  pagers.delete(listEl);
  const items = [...listEl.children];
  for(const li of items) li.hidden = false;
  const holder = listEl.closest("[data-pager]") || listEl.parentElement;
  const pg = holder && holder.querySelector(".pg");
  if(pg) pg.textContent = "";
  listEl.classList.remove("flip");
  if(listEl.clientHeight < 40) return;
  listEl.style.setProperty("--fs", fs + "px");
  if(listEl.scrollHeight <= listEl.clientHeight + 1) return;
  if(noPage) return;                       /* 쪽으로 나누지 않고 작게라도 한 화면에 */
  if(items.length < 2 || items[0].classList.contains("empty")) return;
  const pages = [[]]; let used = 0;
  const H = listEl.clientHeight;
  for(const li of items){
    const h = li.offsetHeight;
    if(used + h > H + 1 && pages[pages.length - 1].length){ pages.push([]); used = 0; }
    pages[pages.length - 1].push(li); used += h;
  }
  const p = { pages, i:0, pg, every:+listEl.dataset.every || PAGE_MS, t:Date.now() };
  pagers.set(listEl, p);
  showPage(listEl, p);
}
/* 여러 칸이 같은 글자 크기를 쓰게 한다: 가장 빡빡한 칸에 맞춘다 */
function fitLists(lists, max, min, noPage){
  const sizes = lists.map(l => bestSize(l, max, min)).filter(v => v != null);
  const fs = sizes.length ? Math.min(...sizes) : max;
  for(const l of lists) applyFit(l, fs, noPage);
}
/* 오늘은 칸이 넓은 만큼 크게, 내일은 그보다 작게. 내일이 오늘보다 커지지는 않는다. */
function fitDays(){
  const a = $("#list-today"), b = $("#list-next");
  const sa = bestSize(a, 70, 40), sb = bestSize(b, 54, 34);
  const fa = sa == null ? 70 : sa;
  applyFit(a, fa);
  applyFit(b, Math.min(sb == null ? 54 : sb, fa));
}
function showPage(listEl, p){
  p.pages.forEach((arr, i) => arr.forEach(li => { li.hidden = i !== p.i; }));
  if(p.pg) p.pg.textContent = `${p.i + 1}/${p.pages.length}`;
  listEl.classList.remove("flip"); void listEl.offsetWidth; listEl.classList.add("flip");
}
function fitWidth(node, max, min){
  node.style.fontSize = max + "px";
  if(node.scrollWidth <= node.clientWidth + 1) return;
  node.style.fontSize = min + "px";
  if(node.scrollWidth > node.clientWidth + 1) return;
  let lo = min, hi = max;
  while(hi - lo > 1){ const mid = (lo + hi) >> 1; node.style.fontSize = mid + "px"; if(node.scrollWidth > node.clientWidth + 1) hi = mid; else lo = mid; }
  node.style.fontSize = lo + "px";
}
/* 여러 글자를 한 줄씩 맞춘 뒤, 그중 가장 작은 크기로 모두 통일한다 */
function fitWidthAll(nodes, max, min, room = 1){
  let fs = max;
  for(const n of nodes){ fitWidth(n, max, min); fs = Math.min(fs, parseFloat(n.style.fontSize) || max); }
  fs = Math.max(min, Math.floor(fs * room));          /* room: 칸에 딱 붙지 않게 남기는 여백 비율 */
  for(const n of nodes) n.style.fontSize = fs + "px";
}
function fitAll(){

/* ============ 시계 · 배치 ============ */
let dayKey = "", reloading = false, lastWorship = null, lastMeal = null, lastBell = "";
/* 하루 한 번, 새벽에 통째로 다시 열어 오래 켜 둔 화면을 깨끗이 한다. 인터넷이 안 될 때 다시 열면 오류 화면이 뜨므로 그땐 건너뛴다. */
async function nightlyReload(){
  if(reloading) return;
  reloading = true;
  try{
    if(location.protocol !== "file:"){
      const r = await fetch(location.href.split("#")[0], { method:"HEAD", cache:"no-store" });
      if(!r.ok) throw new Error(r.status);
    }
    location.reload();
  }catch{ reloading = false; }
}
function tick(){
  setTimeout(tick, 1000 - (Date.now() % 1000) + 8);     /* 다음 차례를 먼저 잡아 둔다: 아래에서 오류가 나도 시계는 계속 간다 */
  try{ tickBody(); }catch(e){ console.error("tick", e); }
}
function tickBody(){
  const n = now();
  $("#hh").textContent = pad(n.hh);
  $("#mm").textContent = pad(n.mm);
  const wd = $("#dwd");
  $("#dmd").textContent = `${n.m}월 ${n.d}일`;
  wd.textContent = `${WD[dowOf(n.key)]}요일`;
  wd.className = "wd" + (dowOf(n.key) === 6 ? " sat" : dowOf(n.key) === 0 ? " sun" : "");
  const wOn = worshipNow(n), ms = mealStage(n), bn = bellNow(n), bk = bn ? `${bn.no}/${bn.done}` : "";
  const bellsMoved = paintBells(n);
  if(n.key !== dayKey || wOn !== lastWorship || ms !== lastMeal || bk !== lastBell){
    const newDay = n.key !== dayKey, mealTurn = lastMeal != null && ms !== lastMeal;      /* 끼니 때가 지나면 다음 급식을 받아 온다 */
    if(newDay) ensureWord();
    if(!state.demo && MEAL.on && ((newDay && dayKey) || mealTurn)) fetchMeal();
    dayKey = n.key; lastWorship = wOn; lastMeal = ms; lastBell = bk; render();
  }
  if(bellsMoved) fitAll();
  else if(n.ss === 0) paintStatus();
  if(n.hh === 3 && n.mm === 30 && performance.now() > 6 * 3600e3 && !FAKE.date && !FAKE.time) nightlyReload();
}

/* 기준은 1920 × 1080. 화면 비율에 따라 높이(900~1240)나 너비(~2560)를 늘려 칸을 채우고, 그래도 남으면 가운데에 둔다. */
function layout(){
  const fit = $("#fit"), stage = $("#stage"), cs = getComputedStyle(fit);
  const pl = parseFloat(cs.paddingLeft) || 0, pt = parseFloat(cs.paddingTop) || 0;
  const vw = fit.clientWidth - pl - (parseFloat(cs.paddingRight) || 0), vh = fit.clientHeight - pt - (parseFloat(cs.paddingBottom) || 0);
  if(vw <= 0 || vh <= 0) return;
  const ratio = vw / vh;
  const W = ratio > 1920 / 900 ? Math.min(2560, 900 * ratio) : 1920;
  const H = ratio > 1920 / 900 ? 900 : Math.min(1240, 1920 / ratio);
  const k = Math.min(vw / W, vh / H);
  stage.style.width = W + "px";
  stage.style.height = H + "px";
  stage.style.transform = `translate(${pl + (vw - W * k) / 2}px,${pt + (vh - H * k) / 2}px) scale(${k})`;
  fitAll();
}

/* ============ 찬송 가사 · 성경 본문 (아침 예배 화면에서 쓴다) ============ */
/* 같은 시트의 '찬송가 가사', '성경 말씀' 탭을 이름으로 찾아 조회한다(모바일 앱과 같은 방식). 번호만 평소 화면에 둔다. */
const WORD_KEY = "board:word:v1";
const wordSaved = store.get(WORD_KEY);
const words = (wordSaved && wordSaved.sheet === SHEET_ID && wordSaved.words) || {};   /* 다른 시트에서 받은 저장본은 버린다 */            /* "찬송|성경" → { at, lyrics:[{n,t}], verses:[{n,t}], lOk, vOk } */
const wordBusy = new Set();
const wordKey = p => `${p.hymn || ""}|${p.bible || ""}`;
/* "요한복음 8:12", "시 23:1-6" → 책·장·절 범위. 못 읽으면 null (그땐 번호만 보인다) */
function parseRef(t){
  const m = String(t || "").match(/^\s*([가-힣]+\d?[가-힣]*)\s*(\d+)\s*(?:[:：]|장)\s*(\d+)\s*절?\s*(?:[-~–]\s*(\d+)\s*절?)?/);
  if(!m) return null;
  const from = +m[3];
  return { book:m[1], ch:+m[2], from, to:Math.min(Math.max(m[4] ? +m[4] : from, from), from + 40) };
}
/* "(1)…\n(2)…" → 절 단위 */
function splitLyrics(v){
  return String(v || "").replace(/\r/g, "").split(/\s*(?=\(\d+\))/).map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^\((\d+)\)\s*([\s\S]*)$/);
    return { n:m ? m[1] : "", t:(m ? m[2] : x).replace(/\s+/g, " ").trim() };
  }).filter(x => x.t);
}
async function fetchWord(p){
  const out = { at:Date.now(), lyrics:[], verses:[], lOk:true, vOk:true };
  const r = parseRef(p.bible), hn = (String(p.hymn || "").match(/\d{1,3}/) || [])[0];
  const jobs = [];
  if(r) jobs.push(gviz("성경 말씀", `select C, D, E where (A = '${r.book}' or B = '${r.book}') and C = ${r.ch} and D >= ${r.from} and D <= ${r.to} order by D`)
    .then(t => { out.verses = t.rows.map(x => ({ n:cText(x.c && x.c[1]), t:cText(x.c && x.c[2]) })).filter(x => x.t); })
    .catch(() => { out.vOk = false; }));
  if(hn) jobs.push(gviz("찬송가 가사", `select A, B where A = ${hn}`)
    .catch(() => gviz("찬송가 가사", `select A, B where A = '${hn}'`))       /* 번호 칸이 글자로 저장된 경우 */
    .then(t => { out.lyrics = splitLyrics(cText(t.rows[0] && t.rows[0].c && t.rows[0].c[1])); })
    .catch(() => { out.lOk = false; }));
  await Promise.all(jobs);
  return out;
}
/* 오늘 찬송·성경의 가사·본문을 미리 받아 둔다. 못 받으면 다음 갱신 때 다시 해 보고, 그동안은 번호만 보인다. */
function ensureWord(){
  if(state.demo) return;
  const p = state.data.pray && state.data.pray[now().key];
  if(!p || !(p.hymn || p.bible)) return;
  const k = wordKey(p), have = words[k];
  if(have && have.lOk && have.vOk) return;
  if(wordBusy.has(k) || (have && Date.now() - have.at < 60e3)) return;
  wordBusy.add(k);
  fetchWord(p).then(w => {
    words[k] = w;
    for(const old of Object.keys(words).sort((a, b) => words[b].at - words[a].at).slice(12)) delete words[old];
    store.set(WORD_KEY, { sheet:SHEET_ID, words });
    render();
  }).catch(e => console.warn("word", e && e.message)).finally(() => wordBusy.delete(k));
}

/* ============ 날씨 ============ */
/* WMO 날씨 코드 → [그림, 글자] */
function wxKind(c){
  if(c === 0) return ["sun", "맑음"];
  if(c === 1) return ["sun", "대체로 맑음"];
  if(c === 2) return ["partly", "구름 조금"];
  if(c === 3) return ["cloud", "흐림"];
  if(c === 45 || c === 48) return ["fog", "안개"];
  if(c >= 51 && c <= 57) return ["rain", "이슬비"];
  if(c >= 61 && c <= 67) return ["rain", "비"];
  if((c >= 71 && c <= 77) || c === 85 || c === 86) return ["snow", "눈"];
  if(c >= 80 && c <= 82) return ["rain", "소나기"];
  if(c >= 95) return ["storm", "뇌우"];
  return ["cloud", "흐림"];
}
const num = v => typeof v === "number" && Number.isFinite(v) ? v : null;
function paintWeather(){
  const w = state.wx, box = $("#wx");
  const show = !!w && Date.now() - w.at < WEATHER.stale;
  if(!changed("wx", show ? [w.t, w.code, w.hi, w.lo, w.pop] : null)) return;
  box.hidden = !show;
  if(!show) return;
  const [icon, label] = wxKind(w.code);
  $("#wxUse").setAttribute("href", "#wx-" + icon);
  $("#wxNow").textContent = `${w.t}°`;
  $("#wxCond").textContent = label;
  $("#wxRange").textContent = w.hi != null && w.lo != null ? `${w.lo}° ~ ${w.hi}°` : "";
  $("#wxPop").textContent = w.pop != null ? `강수 ${w.pop}%` : "";
}
let wxTimer = null;
async function fetchWeather(){
  clearTimeout(wxTimer);
  const ctl = new AbortController(), kill = setTimeout(() => ctl.abort(), 10e3);
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER.lat}&longitude=${WEATHER.lon}`
      + "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"
      + "&timezone=Asia%2FSeoul&forecast_days=1";
    const r = await fetch(url, { signal:ctl.signal, cache:"no-store" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(), c = j.current || {}, d = j.daily || {};
    const t = num(c.temperature_2m), code = num(c.weather_code != null ? c.weather_code : c.weathercode);
    if(t == null || code == null) throw new Error("날씨 응답 모양이 다릅니다");
    const rd = v => { const x = num(Array.isArray(v) ? v[0] : null); return x == null ? null : Math.round(x); };
    state.wx = { t:Math.round(t), code, hi:rd(d.temperature_2m_max), lo:rd(d.temperature_2m_min), pop:rd(d.precipitation_probability_max), at:Date.now() };
  }catch(e){ console.warn("weather", e && e.message); }        /* 날씨는 덤이다: 실패하면 조용히 넘어가고, 묵은 값은 paintWeather 가 숨긴다 */
  finally{ clearTimeout(kill); try{ paintWeather(); }catch(e){ console.error(e); } wxTimer = setTimeout(fetchWeather, WEATHER.every); }
}

/* ============ 급식 (나이스) ============ */
/* 오늘 중식·석식. 오늘 급식이 없으면(주말·방학) 다음 급식일 것을 보인다. 실패하면 조용히 넘어가고 내일 카드는 일정만 돈다. */
const SCHOOL_KEY = "board:school:v1", MEAL_KEY = "board:meal:v1";
const NEIS = "https://open.neis.go.kr/hub/";
async function neis(service, params){
  const ctl = new AbortController(), kill = setTimeout(() => ctl.abort(), 12e3);
  try{
    const q = new URLSearchParams({ Type:"json", pIndex:"1", pSize:"5", ATPT_OFCDC_SC_CODE:SCHOOL.office, ...params });
    const r = await fetch(NEIS + service + "?" + q, { signal:ctl.signal, cache:"no-store" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const body = j[service];
    if(!body){                                                     /* 자료 없음은 { RESULT:{ CODE:"INFO-200" } } 로 온다 */
      const code = j.RESULT && j.RESULT.CODE;
      if(code === "INFO-200") return [];
      throw new Error(code || "응답 모양이 다릅니다");
    }
    return (body.find(x => x.row) || {}).row || [];
  }finally{ clearTimeout(kill); }
}
/* 0: 점심 전 · 1: 점심 뒤 · 2: 저녁 뒤 */
const mealStage = n => { const m = n.hh * 60 + n.mm; return m >= toMin(MEAL.dinnerEnd) ? 2 : m >= toMin(MEAL.lunchEnd) ? 1 : 0; };
const ymdOf = k => k.replace(/-/g, "");
const keyOfYmd = y => `${y.slice(0, 4)}-${y.slice(4, 6)}-${y.slice(6, 8)}`;
/* "현미밥(5.)<br/>쇠고기미역국 (5.6.16.)" → ["현미밥", "쇠고기미역국"] */
function dishes(v){
  return String(v || "").split(/<br\s*\/?>|\n/i).map(x => x
    .replace(/\(\s*[\d.,\s]+\)/g, "")          /* 알레르기 번호 */
    .replace(/(\D)[\d.]+\s*$/, "$1")             /* 괄호 없이 붙은 번호 */
    .replace(/[*#]+/g, "").replace(/\s+/g, " ").trim()).filter(Boolean);
}
async function schoolCode(){
  const c = store.get(SCHOOL_KEY);
  if(c && c.name === SCHOOL.name && c.office === SCHOOL.office && c.sd) return c.sd;
  const rows = await neis("schoolInfo", { SCHUL_NM:SCHOOL.name });
  const row = rows.find(r => r.SCHUL_NM === SCHOOL.name) || rows[0];
  if(!row || !row.SD_SCHUL_CODE) throw new Error("학교를 찾지 못했습니다");
  store.set(SCHOOL_KEY, { name:SCHOOL.name, office:SCHOOL.office, sd:row.SD_SCHUL_CODE });
  return row.SD_SCHUL_CODE;
}
let mealTimer = null;
async function fetchMeal(){
  clearTimeout(mealTimer);
  try{
    const sd = await schoolCode(), n = now(), t = n.key, st = mealStage(n);
    const left = r => { const nm = String(r.MMEAL_SC_NM || ""); return (st < 1 && nm.includes("중식")) || (st < 2 && nm.includes("석식")); };
    let rows = st < 2 ? await neis("mealServiceDietInfo", { SD_SCHUL_CODE:sd, MLSV_YMD:ymdOf(t) }) : [];
    if(!rows.some(left)) rows = await neis("mealServiceDietInfo", { SD_SCHUL_CODE:sd, MLSV_FROM_YMD:ymdOf(addDays(t, 1)), MLSV_TO_YMD:ymdOf(addDays(t, 14)) });
    const day = rows.map(r => String(r.MLSV_YMD || "")).filter(y => /^\d{8}$/.test(y)).sort()[0];
    const pick = name => {
      const r = rows.find(x => x.MLSV_YMD === day && String(x.MMEAL_SC_NM || "").includes(name));
      if(!r) return null;
      const d = dishes(r.DDISH_NM);
      const kcal = (String(r.CAL_INFO || "").match(/[\d.]+/) || [])[0];
      return d.length ? { dishes:d, kcal:kcal ? Math.round(+kcal) : null } : null;
    };
    state.meal = day ? { date:keyOfYmd(day), lunch:pick("중식"), dinner:pick("석식"), at:Date.now() } : { date:t, lunch:null, dinner:null, at:Date.now() };
    store.set(MEAL_KEY, state.meal);
  }catch(e){ console.warn("meal", e && e.message); }
  finally{ try{ render(); }catch(e){ console.error(e); } mealTimer = setTimeout(fetchMeal, MEAL.every); }
}
/* 지난 날짜의 저장본은 쓰지 않고, 오늘 것이라도 이미 지난 끼니는 내린다 */
function mealFor(m){
  const n = now();
  if(!m || m.date < n.key) return null;
  if(m.date > n.key) return m;
  const st = mealStage(n);
  return st ? { ...m, lunch:null, dinner:st >= 2 ? null : m.dinner } : m;
}
function paintMeal(raw){
  const m = mealFor(raw);
  if(!changed("meal", m)) return false;
  for(const slot of ["lunch", "dinner"]){
    const x = m && m[slot];
    $("#menu-" + slot).replaceChildren(...(x ? x.dishes.map(d => el("span", "dish", d)) : []));
  }
  rotSync();
  return true;
}

/* ── 급식 칸: 남은 끼니가 둘이면 중식 ↔ 석식을 번갈아 보인다 ── */
const rot = { phases:[], i:0, t:Date.now() };
function rotSync(){
  const m = mealFor(state.meal), ph = [];
  if(m && m.lunch) ph.push("lunch");
  if(m && m.dinner) ph.push("dinner");
  const cur = rot.phases[rot.i], t = now().key;
  rot.phases = ph;
  rot.i = Math.max(0, ph.indexOf(cur));
  $("#mealTabs").replaceChildren(...(ph.length ? ph.map(p => el("span", "tab", p === "lunch" ? "중식" : "석식")) : [el("span", "tab", "급식")]));
  $("#mealWhen").textContent = !ph.length ? "" : m.date === t ? "오늘" : m.date === addDays(t, 1) ? "내일" : `${mdOf(m.date)} (${WD[dowOf(m.date)]})`;
  $("#mealNone").hidden = ph.length > 0;
  setPhase();
}
function setPhase(){
  const ph = rot.phases[rot.i] || "";
  $("#menu-lunch").classList.toggle("on", ph === "lunch");
  $("#menu-dinner").classList.toggle("on", ph === "dinner");
  [...$("#mealTabs").children].forEach((d, i) => d.classList.toggle("on", i === rot.i));
  const m = mealFor(state.meal), x = m && m[ph];
  $("#mealKcal").textContent = x && x.kcal ? `${x.kcal} kcal` : "";
}
function rotTick(){
  if(rot.phases.length < 2 || Date.now() - rot.t < MEAL.rotate - 50) return;
  rot.t = Date.now();
  rot.i = (rot.i + 1) % rot.phases.length;
  setPhase();
}

/* ============ 불러오기 ============ */
let timer = null, fails = 0;
async function refresh(){
  clearTimeout(timer);
  let bad = TABS.length;
  try{
    const res = await Promise.allSettled(TABS.map(t => gviz(t.sheet)));
    bad = 0;
    res.forEach((r, i) => {
      const t = TABS[i], s = state.src[t.key];
      try{
        if(r.status !== "fulfilled") throw r.reason;
        state.data[t.key] = PARSERS[t.key](r.value);
        s.at = Date.now(); s.error = "";
      }catch(e){ s.error = String((e && e.message) || e).slice(0, 60); bad++; }
    });
    state.tried = true;
    if(bad < TABS.length){ state.loadedAt = Date.now(); saveCache(); }
    fails = bad ? fails + 1 : 0;
    render();
    ensureWord();
  }catch(e){ console.error("refresh", e); }
  finally{ timer = setTimeout(refresh, bad ? RETRY_MS[Math.min(Math.max(fails, 1) - 1, RETRY_MS.length - 1)] : POLL_MS); }  /* 어떤 경우에도 다음 차례는 잡는다 */
}

/* 예시 자료 (?demo) — 시트 없이 화면을 미리 본다. 이름은 모두 지어낸 것이다. */
function demoData(){
  const n = now(), t = n.key, nx = nextWeekday(t);
  const plan = { byDate:{}, dates:[] };
  const put = (k, lines) => { plan.dates.push(k); plan.byDate[k] = lines.map(s => parseItem(s, k)); };
  put(addDays(t, -1), [`[상담부]학부모 상담 주간(~${parts(addDays(t, 3))[2]}일)`]);     /* 어제 시작해 며칠 이어지는 일정 */
  put(t, ["[교목부]목요예배", "[1학년부]안전교육(①,7)", "[교무부]교직원 협의회 (14:30)"]);
  put(nx, [
    "[연구부]수업 공개의 날(①②,3~4)", "[3학년부]진로 특강(③,6,7)", "[교무부]중간고사 감독 교사 연수(7)",
    "[기획위원]부장회의(6,7)", "[2학년부]<자율>학급 활동(②,6-7)", "[2학년부]<자율>학급 활동(③,7)", "[상담부]집단상담(②, ~13일)"
  ]);
  const pray = {}, night = {};
  const names = ["김하나", "이두리", "박세나", "최네리", "정다솜"];
  const dow = dowOf(t), mon = dow === 0 ? addDays(t, 1) : dow === 6 ? addDays(t, 2) : addDays(t, 1 - dow);
  names.forEach((nm, i) => { pray[addDays(mon, i)] = { name:nm, bible:"", hymn:"" }; });
  pray[t] = { name:(pray[t] && pray[t].name) || "김하나", bible:"요한복음 8:12", hymn:"430" };
  night[t] = "홍길동"; night[nx] = "성춘향";
  const mk = (g, arr) => ({ g, classes:arr.map((c, i) => ({ c:i + 1, n:c })), total:arr.reduce((a, b) => a + b, 0) });
  const grades = [mk(1, [19, 20, 20, 20, 19]), mk(2, [19, 19, 20, 19, 19]), mk(3, [22, 20, 20, 20, 20, 18])];
  return {
    plan, pray, night,
    notice:[{ from:t, to:t, text:"이 화면은 예시입니다. 실제 공지는 구글 시트의 ‘공지사항’ 탭에서 불러옵니다." }],
    roster:{ grades, total:grades.reduce((a, g) => a + g.total, 0) }
  };
}

/* ============ 시작 ============ */
const wake = (() => {
  let t; return () => { document.body.classList.remove("idle"); clearTimeout(t); t = setTimeout(() => document.body.classList.add("idle"), 3000); };
})();
async function keepAwake(){ try{ if("wakeLock" in navigator && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); }catch{} }

addEventListener("resize", layout);
addEventListener("mousemove", wake);
const toggleFullscreen = () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
addEventListener("dblclick", toggleFullscreen);
const toggleWorship = () => { forceWorship = !forceWorship; $("#demoWorship").textContent = forceWorship ? "평소 화면으로" : "아침 예배 화면 보기"; tickBody(); };
addEventListener("keydown", e => {
  if(e.key === "f" || e.key === "F") toggleFullscreen();
  if(e.key === "w" || e.key === "W") toggleWorship();
});
$("#demoWorship").addEventListener("click", toggleWorship);
/* 예시 화면에서만 보이는 단추: 시각을 10:30 에 세워 일과 줄과 '지금 교시' 표시를 미리 본다 */
const toggleTime = () => { FAKE.time = FAKE.time ? null : "10:30"; $("#demoTime").textContent = FAKE.time ? "지금 시각으로" : "수업 중(10:30) 화면 보기"; tickBody(); };
$("#demoTime").addEventListener("click", toggleTime);
for(const b of document.querySelectorAll(".status button")) b.addEventListener("dblclick", e => e.stopPropagation());
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible") return;
  keepAwake();
  if(!state.demo && Date.now() - state.loadedAt > 2 * 60e3) refresh();
  if(!state.demo && WEATHER.on && (!state.wx || Date.now() - state.wx.at > WEATHER.every)) fetchWeather();
});
if(document.fonts){
  document.fonts.addEventListener("loadingdone", () => fitAll());
  document.fonts.ready.then(() => fitAll());
}
setInterval(() => {
  const t = Date.now();
  for(const [l, p] of pagers) if(p.pages.length > 1 && t - p.t >= p.every - 50){ p.t = t; p.i = (p.i + 1) % p.pages.length; showPage(l, p); }
  try{ rotTick(); }catch(e){ console.error("rot", e); }
}, 1000);

wake(); keepAwake();
$("#schoolCode").textContent = SCHOOL.code ? `학교코드 ${SCHOOL.code}` : "";
layout();
tick();
if(Q.has("demo") || window.BOARD_DEMO){
  state.demo = true;
  $("#demoWorship").hidden = false;
  $("#demoTime").hidden = false;
  if(FAKE.time) $("#demoTime").textContent = "지금 시각으로";
  state.data = demoData();
  state.wx = { t:18, code:2, hi:22, lo:11, pop:20, at:Date.now() };
  words["430|요한복음 8:12"] = {
    at:Date.now(), lOk:true, vOk:true,
    lyrics:[1, 2, 3].map(i => ({ n:String(i), t:`예시 가사 ${i}절입니다. 이 글은 화면 모양을 보여 주기 위한 가짜 가사이며 실제 가사는 시트의 찬송가 가사 탭에서 불러옵니다.` })),
    verses:[{ n:"12", t:"예시 본문입니다. 이 글은 화면 모양을 보여 주기 위한 가짜 문장이며 실제 본문은 시트의 성경 말씀 탭에서 불러옵니다." }]
  };
  state.meal = { date:mealStage(now()) >= 2 ? addDays(now().key, 1) : now().key, at:Date.now(),
    lunch:{ dishes:["현미밥", "쇠고기미역국", "닭갈비", "도토리묵무침", "배추김치", "요구르트"], kcal:812 },
    dinner:{ dishes:["카레라이스", "유부장국", "돈가스", "양배추샐러드", "깍두기"], kcal:905 } };
  render();
}else{
  loadCache();
  state.meal = store.get(MEAL_KEY) || null;
  render();
  refresh();
  if(WEATHER.on) fetchWeather();
  if(MEAL.on) fetchMeal();
}
