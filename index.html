<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>스마트 알림판</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/*
  배치 (1920 × 1080 을 기준으로 그리고, 화면 크기에 맞춰 통째로 키우고 줄인다. 아래 px 는 모두 그 기준 값이다)
    머리     시계 · 날짜 · 지금 일과 · 날씨
    틀       일과 줄 → 오늘(넓게) | 내일 → 공지 띠 → 급식 | 기도 | 학생현황
    맨 아래  상태 · 단추 (마우스를 움직일 때만 단추가 보인다)
  아침 예배 시간에는 틀 안이 찬송·성경으로 바뀐다.
*/
:root{
  --board:#0b1712; --board-top:#10211a; --panel:#0f1f18; --wash:#152b21; --wash-hi:#1b3629;
  --chalk:#f6f4ec; --chalk-2:#c4d3c9; --chalk-3:#829e8f;
  --rule:rgba(246,244,236,.24); --rule-strong:rgba(246,244,236,.36); --hair:rgba(246,244,236,.11);
  --today:#f7d463; --today-dim:rgba(247,212,99,.16); --today-ink:#231a00;
  --notice:#ff9c8a; --sat:#8fd0ff;
  --ok:#58d39a; --warn:#ffc04d; --err:#ff6b6b;
  --sans:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Nanum Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--board)}
body{
  font-family:var(--sans);color:var(--chalk);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
body.idle,body.idle *{cursor:none!important}

#fit{position:relative;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--board-top) 0%,var(--board) 72%)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;padding:18px 38px 8px}

/* ── 머리 ───────────────────────────────────────── */
.top{flex:none;display:flex;align-items:center;gap:28px;height:128px;padding:0 4px 12px}
.clock{font-size:112px;font-weight:900;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.clock .c{display:inline-block;margin:0 .02em;transform:translateY(-.07em);color:var(--today);animation:blink 2s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:.28}}
.date-wrap{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.date{font-size:50px;font-weight:800;letter-spacing:-.015em;line-height:1.08;white-space:nowrap}
.date .wd{margin-left:.28em;font-weight:700;color:var(--chalk-2)}
.date .wd.sat{color:var(--sat)} .date .wd.sun{color:var(--notice)}
.now-pill{
  display:inline-flex;align-items:center;gap:10px;align-self:flex-start;
  font-size:23px;font-weight:800;line-height:1.2;padding:5px 16px;border-radius:999px;
  background:rgba(246,244,236,.09);border:1.5px solid var(--hair);color:var(--chalk-2);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.now-pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--chalk-3);flex:none}
.now-pill.live{background:var(--today-dim);border-color:rgba(247,212,99,.48);color:var(--today)}
.now-pill.live::before{background:var(--today);box-shadow:0 0 10px var(--today)}
.wx{margin-left:auto;display:flex;align-items:center;gap:18px;padding:10px 22px;border-radius:14px;background:rgba(246,244,236,.045);border:1.5px solid var(--hair)}
.wxi{width:74px;height:74px;flex:none}
.wx .now{font-size:68px;font-weight:900;line-height:1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.wx .sub{display:flex;flex-direction:column;gap:2px;font-size:24px;font-weight:700;line-height:1.18;color:var(--chalk-2);white-space:nowrap}
.wx .sub b{font-size:26px;font-weight:800;color:var(--chalk)}
.wx .meta{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.wx .pop{color:var(--sat)}

/* ── 틀 ─────────────────────────────────────────── */
.frame{
  flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);
  border:2px solid var(--rule-strong);border-radius:12px;
  box-shadow:0 12px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);
}

/* 일과 줄: 교시와 점심을 시간 길이대로 늘어놓고 지금 자리를 표시한다 */
.bells{flex:none;display:flex;height:56px;background:rgba(0,0,0,.2);border-bottom:2px solid var(--rule)}
.bell{
  flex:1 0 0;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:9px;
  overflow:hidden;white-space:nowrap;line-height:56px;border-left:1px solid var(--hair);
  transition:opacity .3s ease,background-color .3s ease;
}
.bell:first-child{border-left:0}
.bell b{font-size:25px;font-weight:800}
.bell span{font-size:20px;font-weight:700;color:var(--chalk-3);font-variant-numeric:tabular-nums}
.bell.gap{background:rgba(0,0,0,.28)}
.bell.rest b{font-weight:700;color:var(--chalk-2)}
.bell.past{opacity:.35}
.bell.now{background:linear-gradient(var(--today-ink),var(--today-ink)) left bottom / var(--p,0%) 7px no-repeat,var(--today)}   /* 아래 검은 줄 = 지나간 만큼 */
.bell.now b,.bell.now span{color:var(--today-ink);font-weight:900}
.bell.soon{background:var(--today-dim);box-shadow:inset 0 0 0 2.5px var(--today)}
.bell.soon b,.bell.soon span{color:var(--today)}

/* 오늘 · 내일 */
.days{flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr)}
.day{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;padding:14px 28px 8px}
.day + .day{border-left:2px solid var(--rule)}
.day.today{background:linear-gradient(180deg,var(--wash-hi) 0%,var(--wash) 140px);box-shadow:inset 0 4px 0 var(--today)}
.day-h{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 16px;min-height:78px;padding-bottom:8px;border-bottom:2px solid var(--hair)}
.dl{display:flex;align-items:baseline;gap:16px;min-width:0}
.dl b{font-size:58px;font-weight:900;line-height:1.12;color:var(--today);white-space:nowrap;letter-spacing:-.02em}
.day.next .dl b{font-size:46px;font-weight:800;color:var(--chalk)}
.dl span{font-size:34px;font-weight:700;color:var(--chalk-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.dl em{
  font-style:normal;font-size:22px;font-weight:800;color:var(--sat);align-self:center;white-space:nowrap;
  background:rgba(143,208,255,.12);border:1.5px solid rgba(143,208,255,.35);border-radius:999px;padding:3px 14px;
}
.hd-r{display:flex;align-items:center;gap:14px;flex:none}
.night{display:inline-flex;align-items:baseline;gap:10px;white-space:nowrap;padding:5px 16px;border-radius:10px;background:rgba(246,244,236,.07);border:1px solid var(--hair)}
.night i{font-style:normal;font-size:22px;font-weight:700;color:var(--chalk-3)}
.night b{font-size:38px;font-weight:800;line-height:1.05}
.day.next .night b{font-size:34px}
.night.off{background:transparent}
.night.off b{font-size:27px;font-weight:700;color:var(--chalk-3)}
.pg{
  font-size:24px;font-weight:800;color:var(--today);font-variant-numeric:tabular-nums;cursor:pointer;
  padding:3px 12px;border-radius:999px;background:var(--today-dim);border:1px solid rgba(247,212,99,.38);
}
.pg:empty{display:none!important}

/* 일정 줄 */
.list{list-style:none;flex:1 1 0;min-height:0;overflow:hidden;font-size:var(--fs,54px);padding-top:4px}
.list.flip{animation:flip .42s cubic-bezier(.22,1,.36,1)}
@keyframes flip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ev{display:flex;align-items:baseline;gap:.42em;padding:.2em .14em;border-bottom:1px solid var(--hair);line-height:1.24;border-radius:6px}
.ev:last-child{border-bottom:0}
.ev.past{opacity:.38}                                                   /* 교시가 이미 끝난 일정 */
.ev.now{background:linear-gradient(90deg,rgba(247,212,99,.18),rgba(247,212,99,.03));box-shadow:inset 5px 0 0 var(--today);padding-left:.34em}
.cb{flex:none;width:max(2.65em,118px)}                                 /* 칩 칸: 부서 이름이 길든 짧든 폭이 같다 */
.chip{
  display:block;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:max(.55em,25px);font-weight:800;line-height:1.32;padding:.15em .14em;border-radius:.32em;
  background:hsl(var(--dh) calc(var(--ds) + 24%) 81%);color:hsl(var(--dh) 58% 13%);box-shadow:inset 0 -1px 0 rgba(0,0,0,.15);
}
.chip.l5{font-size:max(.46em,21px)} .chip.l6{font-size:max(.39em,18px)} .chip.l7{font-size:max(.33em,16px)}
.body{flex:1;min-width:0;font-weight:700;letter-spacing:-.012em;word-break:keep-all;overflow-wrap:anywhere}
.tg{
  display:inline-block;font-style:normal;font-size:max(.5em,23px);font-weight:700;line-height:1.25;white-space:nowrap;vertical-align:.15em;
  padding:.07em .52em;margin-left:.42em;border-radius:.32em;background:rgba(246,244,236,.13);color:var(--chalk-2);
}
.tg.now{background:var(--today);color:var(--today-ink);font-weight:900}   /* 지금 그 교시 */
.tg.cat{margin-left:0;background:transparent;border:1.5px solid rgba(246,244,236,.34)}
.nw{white-space:nowrap}
.empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;text-align:center;font-size:.68em;font-weight:600;color:var(--chalk-3);border:0!important}

/* 공지 띠 (있을 때만) */
.notices{flex:none;display:flex;align-items:center;gap:22px;padding:11px 28px;border-top:2px solid var(--rule);background:linear-gradient(90deg,rgba(255,156,138,.18),rgba(255,156,138,.08))}
.notices .nl{flex:none;font-size:28px;font-weight:900;color:#380e07;background:var(--notice);border-radius:8px;padding:.14em .66em;letter-spacing:.02em}
.notices .list{flex:1;max-height:112px;padding-top:0;font-size:var(--fs,42px)}
.nt{position:relative;padding:.08em 0 .08em .68em;font-weight:800;line-height:1.24;word-break:keep-all;overflow-wrap:anywhere}
.nt::before{content:"";position:absolute;left:0;top:.6em;width:.28em;height:.28em;border-radius:50%;background:var(--notice)}
.notices .pg{color:var(--notice);background:rgba(255,156,138,.16);border-color:rgba(255,156,138,.4)}

/* 아래 줄: 급식 · 기도 · 학생현황 */
.info{flex:none;display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,1.24fr) minmax(0,1fr);height:194px;border-top:2px solid var(--rule);background:rgba(0,0,0,.14)}
.cell{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;overflow:hidden;padding:12px 26px}
.cell + .cell{border-left:2px solid var(--rule)}
.cell h3{flex:none;display:flex;align-items:center;gap:12px;font-size:25px;font-weight:800;letter-spacing:.02em;line-height:1.2;color:var(--chalk-3);white-space:nowrap}
.cell h3 .sp{flex:1}
.cell h3 > b{font-size:34px;font-weight:900;letter-spacing:0;line-height:1;color:var(--chalk);font-variant-numeric:tabular-nums}
/* 급식: 남은 끼니만. 둘이면 번갈아 보이고, 이름표를 누르면 그 끼니로 넘어간다 */
.tabs{display:inline-flex;gap:8px}
.tab{font-size:28px;font-weight:800;letter-spacing:0;line-height:1.15;padding:2px 12px;border-radius:8px;color:var(--chalk-3);border:1.5px solid transparent;cursor:pointer;transition:color .25s ease,background-color .25s ease}
.tab.on{color:var(--today-ink);background:var(--today);border-color:var(--today)}
.when{font-size:21px;font-weight:800;color:var(--chalk-2);padding:2px 10px;border-radius:999px;background:rgba(246,244,236,.08)}
.when:empty{display:none}
.kcal{font-size:24px;font-weight:700;letter-spacing:0;color:var(--chalk-2);font-variant-numeric:tabular-nums}
.menus{flex:1 1 0;min-height:0;overflow:hidden;display:grid;grid-template:minmax(0,1fr) / minmax(0,1fr)}
.menus > *{grid-area:1 / 1;min-height:0}
.menu{overflow:hidden;margin-left:-.85em;font-size:var(--fs,40px);font-weight:700;line-height:1.28;word-break:keep-all;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.menu.on{opacity:1;visibility:visible;transition:opacity .45s ease}
.dish{display:inline-block;position:relative;padding-left:.85em}        /* 가운뎃점은 음식 앞에 찍고, 줄 맨 앞의 점은 칸 밖으로 밀려 잘린다 */
.dish::before{content:"";position:absolute;left:.34em;top:.55em;width:.16em;height:.16em;border-radius:50%;background:var(--today);opacity:.75}
.none{align-self:center;font-size:28px;font-weight:600;color:var(--chalk-3)}
/* 기도: 이번 주 다섯 날 + 오늘 찬송·성경 */
.dv{min-width:0;overflow:hidden;font-size:27px;font-weight:700;letter-spacing:0;color:var(--chalk-2);cursor:pointer}
.dv b{font-weight:800;color:var(--today)}
.week{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wk{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;text-align:center;border-radius:8px;background:rgba(246,244,236,.055);border:1px solid var(--hair);padding:4px}
.wk .d{font-size:21px;font-weight:700;color:var(--chalk-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.wk .n{font-size:42px;font-weight:800;line-height:1.18;white-space:nowrap;overflow:hidden}
.wk .n.nil{color:var(--chalk-3);font-weight:600}
.wk.past{opacity:.42}
.wk.now{background:var(--today);border-color:var(--today);box-shadow:0 4px 14px rgba(247,212,99,.22)}
.wk.now .d{color:#5e4600;font-weight:800}
.wk.now .n{color:var(--today-ink);font-weight:900}
/* 학생현황: 학년 × 반 표 */
.stu{flex:1 1 0;min-height:0;display:grid;grid-template-columns:auto repeat(var(--n,6),minmax(0,1fr)) auto;align-content:space-between;align-items:baseline;column-gap:6px;font-variant-numeric:tabular-nums}
.stu .gh,.stu .ch,.stu .th{font-size:19px;font-weight:700;color:var(--chalk-3);padding-bottom:2px;border-bottom:1px solid var(--hair);white-space:nowrap}
.stu .ch,.stu .th{text-align:right}
.stu .th{padding-left:12px}
.stu .g{font-size:24px;font-weight:800;color:var(--chalk-2);white-space:nowrap;padding-right:8px}
.stu .c{font-size:min(25px,calc(176px / var(--n,6)));font-weight:600;color:var(--chalk-2);text-align:right}
.stu b{font-size:30px;font-weight:900;line-height:1;text-align:right;padding-left:12px}

/* ── 아침 예배: 그 시간에만 찬송·성경이 틀을 가득 채운다 ── */
.worship{display:none;flex:1 1 0;min-height:0;flex-direction:column;justify-content:center;gap:20px;overflow:hidden;padding:24px 48px 28px;background:linear-gradient(180deg,var(--wash-hi) 0%,var(--wash) 100%)}
.wh{display:flex;align-items:baseline;gap:26px;padding-bottom:14px;border-bottom:2px solid var(--hair)}
.wh b{font-size:58px;font-weight:900;color:var(--today)}
.wh span{font-size:36px;font-weight:700;color:var(--chalk-2);font-variant-numeric:tabular-nums}
.wh .wp{margin-left:auto;font-size:50px;font-weight:800;color:var(--chalk-2)}
.wh .wp strong{margin-left:.32em;font-weight:900;color:var(--chalk)}
.wb{flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-rows:minmax(0,1fr)}
.wb.one{grid-template-columns:minmax(0,1fr)}
.wb.txt{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.wcol{min-width:0;min-height:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr;padding:0 34px;text-align:center}
.wcol:first-child{padding-left:0} .wcol:last-child{padding-right:0}
.wcol + .wcol{border-left:2px solid var(--rule)}
.wcol i{display:block;font-style:normal;font-size:52px;font-weight:800;color:var(--chalk-3);letter-spacing:.1em}
.wcol b{display:block;align-self:center;font-weight:900;line-height:1.14;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.wcol .wtext,.wcol .pg{display:none}
.wcol.has-text{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:22px;align-items:center;text-align:left}
.wcol.has-text i{font-size:48px}
.wcol.has-text .pg{display:block;font-size:30px}
.wcol.has-text .wtext{display:block;grid-column:1 / -1;align-self:stretch;margin-top:8px;padding:12px 0 0;border-top:2px solid var(--hair);font-size:var(--fs,48px);line-height:1.35}
.wtext .vs{padding:.12em 0;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.wtext .vs.n{padding-left:1.15em;text-indent:-1.15em}
.wtext .vn{display:inline-block;min-width:1.45em;margin-right:.32em;text-indent:0;text-align:center;font-size:.58em;font-weight:900;color:var(--today-ink);background:var(--today);border-radius:.28em;padding:.04em .28em;vertical-align:.2em}
#stage.worship-on .bells,#stage.worship-on .days,#stage.worship-on .notices,#stage.worship-on .info{display:none}
#stage.worship-on .worship{display:flex}

/* ── 맨 아래 줄 ─────────────────────────────────── */
.status{flex:none;height:40px;display:flex;align-items:center;gap:12px;padding:2px 4px 0;font-size:20px;font-weight:600;color:var(--chalk-3);white-space:nowrap;overflow:hidden}
.dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.err{background:var(--err);box-shadow:0 0 8px var(--err)}
.status .sp{flex:1}
.status .stxt,.status .cr{min-width:0;overflow:hidden;text-overflow:ellipsis}
#schoolCode{font-variant-numeric:tabular-nums;letter-spacing:.04em}
#schoolCode:empty{display:none}
.ctrl{display:flex;align-items:center;gap:8px;transition:opacity .35s ease}
body.idle .ctrl{opacity:0;pointer-events:none}                         /* 아무도 만지지 않으면 단추를 감춘다 */
.status button{
  font:inherit;font-size:19px;font-weight:700;color:var(--chalk);cursor:pointer;
  background:rgba(246,244,236,.09);border:1.5px solid var(--rule);border-radius:999px;padding:2px 15px;
}
.status button:hover{background:rgba(246,244,236,.2);border-color:var(--chalk-2)}
.status button:focus-visible{outline:3px solid var(--today);outline-offset:2px}

/* 전체화면 안내: 브라우저가 자동 전체화면을 막았을 때만. 연 직후 잠깐과 마우스를 움직이는 동안에만 보이고, 아무도 없는 화면에서는 사라진다 */
.fs-hint{
  position:absolute;left:50%;bottom:58px;transform:translateX(-50%);z-index:4;
  display:none;align-items:center;gap:16px;padding:12px 16px 12px 26px;border-radius:999px;
  background:rgba(15,31,24,.95);border:2px solid var(--today);box-shadow:0 10px 32px rgba(0,0,0,.55);
  font-size:25px;font-weight:800;white-space:nowrap;cursor:pointer;transition:opacity .35s ease;
}

<script>
"use strict";
/*
  스마트 알림판 — 빌드도 서버도 없는 한 장짜리 화면.
  자료: 「2026학년도 학사일정」 구글 시트를 gviz(JSONP)로 읽기만 한다. 급식은 나이스, 날씨는 Open-Meteo.
  설정은 config.js 에서 고친다. 자세한 것은 README.md.

  주소 끝에 붙이는 미리보기 도구
    ?demo             시트 없이 예시 자료로 본다
    ?date=2026-10-01  그날인 것처럼 본다          ?time=07:52  그 시각인 것처럼 본다(아침 예배 화면 미리보기)
    ?worship          시간과 상관없이 아침 예배 화면을 본다

  ※ 이 파일의 정규식에는 '역슬래시+괄호', '역슬래시+대괄호'를 쓰지 않는다([(] · \x5B 처럼 쓴다).
    채팅 창 등을 거쳐 붙여 넣을 때 그 글자 쌍이 수식 기호($)로 바뀌어 일정이 통째로 안 보인 일이 있었기 때문이다.
    tests/smoke.cjs 가 이를 검사한다.
*/

/* ============ 설정 ============ */
/* 고칠 곳은 config.js 다. 아래는 config.js 를 못 읽었을 때 쓰는 기본값이다(config.js 와 같은 내용). */
const DEFAULT_CONFIG = {
  sheetId:"1qg5vX4KlrI3hwn1XLiLIupkO74zxleqV6Imk1y5YQIE",
  tabs:{ plan:"연중행사계획", notice:"공지사항", pray:"기도순서", night:"자습감독", roster:"학생현황", bible:"성경 말씀", hymn:"찬송가 가사" },
  school:{ name:"보성여자고등학교", office:"B10", code:"B100000447" },
  weather:{ on:true, lat:37.5665, lon:126.9780 },
  meal:{ on:true, lunchEnd:"12:00", dinnerEnd:"19:00", rotateSeconds:8 },
  worship:{ from:"07:50", to:"07:55", days:[1, 2, 3, 4, 5] },
  bells:{ days:[1, 2, 3, 4, 5], from:"07:00", rows:[
    ["1교시", "08:10", "09:00"], ["2교시", "09:10", "10:00"], ["3교시", "10:10", "11:00"], ["점심", "11:00", "12:00"],
    ["4교시", "12:00", "12:50"], ["5교시", "13:00", "13:50"], ["6교시", "14:00", "14:50"], ["7교시", "15:00", "15:50"]
  ] },
  nightlyReload:"03:30"
};
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
const merge = (a, b) => {
  if(!isObj(a) || !isObj(b)) return b === undefined || b === null ? a : b;
  const out = { ...a };
  for(const k of Object.keys(b)) out[k] = merge(a[k], b[k]);
  return out;
};
const CFG = merge(DEFAULT_CONFIG, window.BOARD_CONFIG);
const HM_RE = /^([01]?\d|2[0-3]):[0-5]\d$/;
const hm = (v, d) => HM_RE.test(String(v || "")) ? String(v) : d;
const dayList = (v, d) => Array.isArray(v) && v.every(x => Number.isInteger(x) && x >= 0 && x <= 6) ? v : d;

const SHEET_ID = String(CFG.sheetId || DEFAULT_CONFIG.sheetId).trim();
const TAB = { ...DEFAULT_CONFIG.tabs, ...CFG.tabs };
const TABS = [
  { key:"plan",   sheet:TAB.plan,   name:"학사일정" },
  { key:"notice", sheet:TAB.notice, name:"공지사항" },
  { key:"pray",   sheet:TAB.pray,   name:"기도순서" },
  { key:"night",  sheet:TAB.night,  name:"자습감독" },
  { key:"roster", sheet:TAB.roster, name:"학생현황" }
];
const TZ = "Asia/Seoul";
const SCHOOL = CFG.school;
const WEATHER = { on:CFG.weather.on !== false, lat:+CFG.weather.lat, lon:+CFG.weather.lon, every:30 * 60e3, stale:3 * 3600e3 };
const MEAL = {
  on:CFG.meal.on !== false, every:60 * 60e3, rotate:Math.max(3, +CFG.meal.rotateSeconds || 8) * 1e3,
  lunchEnd:hm(CFG.meal.lunchEnd, "12:00"), dinnerEnd:hm(CFG.meal.dinnerEnd, "19:00")
};
const WORSHIP = { from:hm(CFG.worship.from, "07:50"), to:hm(CFG.worship.to, "07:55"), days:dayList(CFG.worship.days, [1, 2, 3, 4, 5]) };
const BELLS = {
  days:dayList(CFG.bells.days, [1, 2, 3, 4, 5]), from:hm(CFG.bells.from, "07:00"),
  rows:(Array.isArray(CFG.bells.rows) ? CFG.bells.rows : []).filter(r => Array.isArray(r) && r[0] && HM_RE.test(r[1]) && HM_RE.test(r[2]))
};
const NIGHTLY = hm(CFG.nightlyReload, "03:30");
const POLL_MS = 5 * 60e3, RETRY_MS = [15e3, 30e3, 60e3], TIMEOUT_MS = 15e3;
const PAGE_MS = 9e3, STALE_MS = 15 * 60e3;
const CACHE_KEY = "board:cache:v1", WORD_KEY = "board:word:v1", SCHOOL_KEY = "board:school:v1", MEAL_KEY = "board:meal:v1";

/* 부서 — [이름, 색상, 채도]. 학사일정 앱과 같은 색을 써서 두 화면의 부서 색이 같다. */
const DEPTS = [
  ["교목부",292,40],["교무부",220,44],["연구부",232,42],["상담부",320,38],["정보부",244,40],
  ["1학년부",16,52],["2학년부",30,54],["3학년부",44,54],["기획위원",254,38],["행정실",210,26],
  ["국어과",108,40],["영어과",124,38],["수학과",160,42],["사회과",138,36],["과학과",172,42],
  ["예체능과",184,40],["정보과",196,42],["외국어과",66,46],["기타",212,7]
];
const TONE = new Map(DEPTS.map(([n, h, s]) => [n, `--dh:${h};--ds:${s}%`]));
const tone = d => TONE.get(d) || TONE.get("기타");

/* ============ 작은 도구 ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, "0");
const WD = ["일","월","화","수","목","금","토"];
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parts = k => k.split("-").map(Number);
const utc = k => { const [y, m, d] = parts(k); return Date.UTC(y, m - 1, d); };
const addDays = (k, n) => new Date(utc(k) + n * 864e5).toISOString().slice(0, 10);
const dowOf = k => new Date(utc(k)).getUTCDay();
const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const mdOf = k => { const [, m, d] = parts(k); return `${m}/${d}`; };
const toMin = v => { const [h, m] = v.split(":").map(Number); return h * 60 + m; };
const clockMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const el = (tag, cls, ...kids) => {
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  for(const k of kids) if(k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch{ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.remove("hide");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hide"), 2600);
}

/* ============ 시각: 어느 컴퓨터에서 열어도 한국 시간으로 본다 ============ */
const kstFmt = new Intl.DateTimeFormat("en-GB", { timeZone:TZ, hourCycle:"h23", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
function kstParts(ms){
  const p = {};
  for(const x of kstFmt.formatToParts(ms == null ? new Date() : new Date(ms))) p[x.type] = x.value;
  return { y:+p.year, m:+p.month, d:+p.day, hh:+p.hour, mm:+p.minute, ss:+p.second };
}
const Q = new URLSearchParams(location.search);
const FAKE = {
  date:/^\d{4}-\d{2}-\d{2}$/.test(Q.get("date") || "") ? Q.get("date") : null,
  time:/^\d{1,2}:\d{2}$/.test(Q.get("time") || "") ? Q.get("time") : null
};
function now(){
  const n = kstParts();
  if(FAKE.date) [n.y, n.m, n.d] = parts(FAKE.date);
  if(FAKE.time){ [n.hh, n.mm] = FAKE.time.split(":").map(Number); n.ss = 0; }
  n.key = ymd(n.y, n.m, n.d);
  return n;
}
const clockOf = ms => { const p = kstParts(ms); return `${pad(p.hh)}:${pad(p.mm)}`; };
const schoolYear = () => { const n = now(); return n.m >= 3 ? n.y : n.y - 1; };
const hymnText = h => /^\d{1,3}$/.test(h) ? `${h}장` : (h || "");

let forceWorship = Q.has("worship");          /* W 키나 '아침 예배 보기' 단추로도 켜고 끈다 */
function worshipNow(n){
  if(forceWorship) return true;
  const m = n.hh * 60 + n.mm;
  return WORSHIP.days.includes(dowOf(n.key)) && m >= toMin(WORSHIP.from) && m <= toMin(WORSHIP.to);
}
/* 일과가 지금 어디쯤인지. cur = 진행 중인 칸, soon = 곧 시작할 칸(쉬는 시간·등교 전), no = 지금 교시 번호, done = 끝난 마지막 교시 번호 */
const BELL = BELLS.rows.map(([name, a, b]) => ({ name:String(name), a:toMin(a), b:toMin(b), no:/^\d/.test(name) ? parseInt(name, 10) : 0 }));
function bellNow(n){
  if(!BELL.length || !BELLS.days.includes(dowOf(n.key))) return null;
  const m = n.hh * 60 + n.mm;
  const cur = BELL.findIndex(x => m >= x.a && m < x.b);
  return {
    m, cur, soon:cur < 0 ? BELL.findIndex(x => m < x.a) : -1,
    no:cur >= 0 ? BELL[cur].no : 0,
    done:Math.max(0, ...BELL.filter(x => x.no && m >= x.b).map(x => x.no)),
    show:m >= toMin(BELLS.from) && m < BELL[BELL.length - 1].b
  };
}

/* ============ 시트 읽기 (gviz JSONP) ============ */
let seq = 0;
function gviz(sheet, tq){
  return new Promise((resolve, reject) => {
    const cb = `__board${++seq}_${Date.now().toString(36)}`;
    const s = document.createElement("script");
    let done = false;
    const finish = (err, val) => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      window[cb] = () => {};
      setTimeout(() => { delete window[cb]; }, 60e3);
      s.remove();
      err ? reject(err) : resolve(val);
    };
    const timer = setTimeout(() => finish(new Error("응답 시간 초과")), TIMEOUT_MS);
    window[cb] = res => {
      if(!res || res.status === "error"){
        const e = res && res.errors && res.errors[0];
        const msg = e && (e.detailed_message || e.message || e.reason);
        finish(new Error(msg ? String(msg).replace(/<[^>]*>/g, "") : "시트가 오류를 돌려주었습니다"));
        return;
      }
      const t = res.table;
      if(!t || !Array.isArray(t.rows) || !Array.isArray(t.cols)){ finish(new Error("표 형식이 아닙니다")); return; }
      finish(null, t);
    };
    s.onerror = () => finish(new Error("연결하지 못했습니다"));
    /* 비공개 시트는 로그인 페이지를 돌려줘 콜백이 불리지 않는다 */
    s.onload = () => setTimeout(() => finish(new Error("시트를 읽을 수 없습니다 (공유 설정 확인)")), 50);
    s.src = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(SHEET_ID)}/gviz/tq?tqx=out:json;responseHandler:${cb}`
      + `&sheet=${encodeURIComponent(sheet)}` + (tq ? `&tq=${encodeURIComponent(tq)}` : "") + `&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}

/* ============ 셀 해석 ============ */
const cText = c => !c ? "" : (c.f != null && c.f !== "") ? String(c.f).trim() : (c.v == null ? "" : String(c.v).trim());
const valid = (y, m, d) => {
  if(!(y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  return new Date(y, m - 1, d).getMonth() === m - 1 ? ymd(y, m, d) : null;
};
/* MM-DD 로만 적힌 날짜의 연도: 12월 → 1월로 넘어가면 해를 올린다 */
function yearCursor(start){
  let year = start, last = 0;
  return {
    year(m){ if(last && m < last && last - m >= 6) year++; last = m; return year; },
    seen(m, y){ year = y; last = m; }
  };
}
function cellDate(c, cur){
  if(!c) return null;
  if(typeof c.v === "string"){
    const g = c.v.match(/^Date[(](\d+),\s*(\d+),\s*(\d+)/);           /* gviz 날짜: "Date(2026,10,17)" (월은 0부터) */
    if(g){ if(cur) cur.seen(+g[2] + 1, +g[1]); return valid(+g[1], +g[2] + 1, +g[3]); }
  }
  const t = cText(c);
  let m = t.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if(m){ if(cur) cur.seen(+m[2], +m[1]); return valid(+m[1], +m[2], +m[3]); }
  m = t.match(/^(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?$/);
  if(m && cur) return valid(cur.year(+m[1]), +m[1], +m[2]);
  return null;
}
/* 머리글 줄을 찾아 열 위치를 정한다. 못 찾으면 시트의 현재 배치를 쓴다. */
function columns(table, fallback){
  const names = Object.keys(fallback), out = { ...fallback };
  for(const r of table.rows.slice(0, 8)){
    const t = (r.c || []).map(cText);
    if(names.filter(n => t.includes(n)).length >= Math.min(2, names.length)){
      names.forEach(n => { const i = t.indexOf(n); if(i >= 0) out[n] = i; });
      return out;
    }
  }
  const labels = (table.cols || []).map(c => String(c.label || "").trim().split(/\s+/).pop());
  names.forEach(n => { const i = labels.indexOf(n); if(i >= 0) out[n] = i; });
  return out;
}

/* ============ 일정 한 줄 해석 ============ */
const CIRCLED = { "①":1, "②":2, "③":3 };
/* "[교무부]개학식(②③,1) [교무부]입학식(①,2시)" → 줄 단위로, 한 줄에 [부서]가 여럿이면 갈라서 */
function splitCell(text){
  const out = [];
  for(const line of String(text || "").replace(/\r/g, "").split("\n")){
    for(const piece of line.split(/\s+(?=\x5B[^\x5B\x5D]{1,20}\x5D)/)){
      const s = piece.trim();
      if(!s || s === "null") continue;
      if(s.startsWith("[") || !out.length) out.push(s);
      else out[out.length - 1] += " " + s;
    }
  }
  return out;
}
const circledGrades = s => [...new Set([...s].map(ch => CIRCLED[ch]).filter(Boolean))].sort();
const PERIOD_TOKEN = /^(\d)\s*(?:[~\-–]\s*(\d))?\s*(?:교시)?$/;
const RANGE_TOKEN = /^~\s*\d{1,2}(?:\s*[\/.]\s*\d{1,2})?\s*일?$/;
const PAREN = /[(]([^()]*)[)]/g;                                        /* 괄호 한 쌍과 그 안 */
function findPeriods(s){
  const set = new Set();
  const add = (a, b) => { a = +a; b = b ? +b : a; if(a < 1 || b > 9 || b < a) return; for(let k = a; k <= b; k++) set.add(k); };
  for(const m of s.matchAll(/(\d)\s*(?:[~\-–]\s*(\d)\s*)?교시/g)) add(m[1], m[2]);
  for(const g of s.matchAll(PAREN)){
    for(const tok of g[1].split(/[,，]/)){
      const m = tok.replace(/[①②③]/g, "").trim().match(PERIOD_TOKEN);
      if(m) add(m[1], m[2]);
    }
  }
  return [...set].sort((a, b) => a - b);
}
/* "(~3/11)", "(②, ~13일)" 처럼 끝나는 날이 적힌 일정 */
function findEnd(s, start){
  const [sy, sm, sd] = parts(start);
  let y = sy, mo, d;
  let m = s.match(/~\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})/);
  if(m){
    mo = +m[1]; d = +m[2];
    if(mo < sm && sm - mo >= 6) y++;
  }else{
    m = null;
    for(const x of s.matchAll(/~\s*(\d{1,2})\s*일?(?=\s*[),]|\s*$)/g)){
      if(/\d\s*$/.test(s.slice(0, x.index))) continue;     /* "1~3" 처럼 숫자 바로 뒤의 ~ 는 범위다 */
      m = x; break;
    }
    if(!m) return null;
    mo = sm; d = +m[1];
    if(d < sd){ mo++; if(mo > 12){ mo = 1; y++; } }
  }
  const k = valid(y, mo, d);
  return k && k > start ? k : null;
}
/* 학년·교시·기간만 담긴 괄호는 태그로 따로 보이므로 본문에서 뺀다 */
function cleanText(s){
  return s.replace(/\s*[(]([^()]*)[)]/g, (all, inner) => {
    const toks = inner.split(/[,，]/).map(t => t.trim()).filter(Boolean);
    const rest = toks.filter(t => {
      const x = t.replace(/[①②③]/g, "").trim();
      return !(x === "" || PERIOD_TOKEN.test(x) || RANGE_TOKEN.test(x));
    });
    if(rest.length === toks.length) return all;
    return rest.length ? `(${rest.join(", ")})` : "";
  }).replace(/\s{2,}/g, " ").trim();
}
function parseItem(src, date){
  let s = src.trim(), dept = "", cat = "";
  let m = s.match(/^\x5B([^\x5D]{1,20})\x5D\s*/);                       /* [부서] */
  if(m){ dept = m[1].trim(); s = s.slice(m[0].length); }
  m = s.match(/^<([^>]{1,10})>\s*/);                                    /* <분류> */
  if(m){ cat = m[1].trim(); s = s.slice(m[0].length); }
  return { dept, cat, text:cleanText(s) || s, grades:circledGrades(s), periods:findPeriods(s), until:findEnd(s, date) };
}

/* ============ 시트별 해석 ============ */
function parsePlan(t){
  const h = columns(t, { "날짜":0, "요일":1, "일정":2 });
  const byDate = {}, dates = new Set();
  for(const r of t.rows){
    const c = r.c || [];
    const date = cellDate(c[h["날짜"]]);
    if(!date) continue;
    dates.add(date);
    const items = splitCell(cText(c[h["일정"]])).map(s => parseItem(s, date)).filter(it => it.text && it.text !== "null");
    if(items.length) (byDate[date] = byDate[date] || []).push(...items);
  }
  if(!dates.size) throw new Error("날짜가 적힌 줄을 찾지 못했습니다");
  return { byDate, dates:[...dates].sort() };
}
function parseNotice(t){
  const h = columns(t, { "게시 시작일":0, "게시 종료일":1, "내용":2 });
  const out = [];
  for(const r of t.rows){
    const c = r.c || [];
    const text = cText(c[h["내용"]]);
    if(!text || text === "null" || text === "내용") continue;
    const rawFrom = cText(c[h["게시 시작일"]]), rawTo = cText(c[h["게시 종료일"]]);
    const from = cellDate(c[h["게시 시작일"]]), to = cellDate(c[h["게시 종료일"]]);
    if((rawFrom && !from) || (rawTo && !to)) continue;      /* 기간을 못 읽는 줄은 싣지 않는다 */
    if(from && to && from > to) continue;
    out.push({ from, to, text });
  }
  return out;
}
function parsePray(t){
  const h = columns(t, { "날짜":0, "요일":1, "이름":2, "성경":3, "찬송":4 });
  const cur = yearCursor(schoolYear()), out = {};
  for(const r of t.rows){
    const c = r.c || [];
    const date = cellDate(c[h["날짜"]], cur);
    if(!date) continue;
    const p = { name:cText(c[h["이름"]]), bible:cText(c[h["성경"]]), hymn:cText(c[h["찬송"]]) };
    if(p.name || p.bible || p.hymn) out[date] = p;
  }
  return out;
}
function parseNight(t){
  const h = columns(t, { "날짜":0, "요일":1, "이름":2 });
  const cur = yearCursor(schoolYear()), out = {};
  for(const r of t.rows){
    const c = r.c || [];
    const date = cellDate(c[h["날짜"]], cur), name = cText(c[h["이름"]]);
    if(date && name) out[date] = name;
  }
  return out;
}
/* 학생현황: 학년마다 [학급 · 담임 · 학생수] 세 칸. 머리글이 열 이름으로 합쳐져 오든 첫 줄로 오든 읽는다. */
function parseRoster(t){
  const lastWord = x => String(x || "").trim().split(/\s+/).pop();
  const grid = [(t.cols || []).map(c => lastWord(c.label)), ...t.rows.map(r => (r.c || []).map(cText))];
  let hr = -1, cnt = [];
  for(let i = 0; i < Math.min(grid.length, 8); i++){
    const idx = grid[i].map((v, j) => lastWord(v) === "학생수" ? j : -1).filter(j => j >= 0);
    if(idx.length){ hr = i; cnt = idx; break; }
  }
  if(hr < 0) throw new Error("학생수 칸을 찾지 못했습니다");
  const body = hr === 0 ? t.rows : t.rows.slice(hr);
  const num = c => c && typeof c.v === "number" ? c.v : parseInt(cText(c), 10);
  const grades = cnt.slice(0, 3).map((col, k) => {
    const classes = [];
    for(const r of body){
      const c = r.c || [], n = num(c[col]), no = num(c[col - 2]);
      if(Number.isInteger(n) && n > 0 && Number.isInteger(no) && no > 0) classes.push({ c:no, n });
    }
    return { g:k + 1, classes, total:classes.reduce((a, x) => a + x.n, 0) };
  }).filter(x => x.classes.length);
  if(!grades.length) throw new Error("학급별 학생 수를 읽지 못했습니다");
  return { grades, total:grades.reduce((a, x) => a + x.total, 0) };
}
const PARSERS = { plan:parsePlan, notice:parseNotice, pray:parsePray, night:parseNight, roster:parseRoster };

/* ============ 상태 · 저장본 ============ */
const state = { data:{ plan:null, notice:null, pray:null, night:null, roster:null }, src:{}, loadedAt:0, demo:false, tried:false, wx:null, meal:null };
for(const t of TABS) state.src[t.key] = { at:0, error:"" };
function saveCache(){
  const tabs = {};
  for(const t of TABS) if(state.data[t.key]) tabs[t.key] = { at:state.src[t.key].at, data:state.data[t.key] };
  store.set(CACHE_KEY, { v:1, sheet:SHEET_ID, tabs });
}
function loadCache(){

}

/* ============ 오늘 · 내일 계산 ============ */
const nextWeekday = k => { let d = addDays(k, 1); while([0, 6].includes(dowOf(d))) d = addDays(d, 1); return d; };
const itemKey = it => [it.dept, it.cat, it.text].join("\u0001");
/* 같은 부서·같은 이름의 일정은 한 줄로 묶고, 학년·교시만 태그로 나열한다 */
function groupItems(items){
  const out = [], idx = new Map();
  for(const it of items){
    const k = itemKey(it);
    let g = idx.get(k);
    if(!g){ g = { dept:it.dept, cat:it.cat, text:it.text, vars:[] }; idx.set(k, g); out.push(g); }
    const v = { grades:it.grades, periods:it.periods, until:it.until };
    const vk = JSON.stringify(v);
    if(!g.vars.some(x => JSON.stringify(x) === vk)) g.vars.push(v);
  }
  return out;
}
function periodLabel(ps){
  const a = [...ps].sort((x, y) => x - y);
  const run = a.length > 1 && a.every((v, i) => i === 0 || v === a[i - 1] + 1);
  return run ? `${a[0]}~${a[a.length - 1]}교시` : `${a.join("·")}교시`;
}
function varLabel(v){
  const out = [];
  if(v.grades.length) out.push(v.grades.length === 3 ? "전학년" : `${v.grades.join("·")}학년`);
  if(v.periods.length) out.push(periodLabel(v.periods));
  if(v.until) out.push(`~${mdOf(v.until)}`);
  return out.join(" ");
}
/* "(~13일)" 처럼 끝나는 날이 적힌 일정은 시작한 날에만 적혀 있어도 끝나는 날까지 날마다 보인다.
   그날 칸에 같은 부서·같은 이름의 일정이 이미 적혀 있으면 겹쳐 싣지 않는다. */
const CARRY_DAYS = 45;
function itemsOn(plan, k){
  const by = plan.byDate || {}, own = by[k] || [], out = [...own];
  const seen = new Set(own.map(itemKey)), from = addDays(k, -CARRY_DAYS);
  for(const d of Object.keys(by).sort()){
    if(d < from || d >= k) continue;
    for(const it of by[d]){
      if(!it.until || it.until < k || seen.has(itemKey(it))) continue;
      seen.add(itemKey(it)); out.push(it);
    }
  }
  return out;
}
function dayView(k, label, plan, tag){
  return {
    key:k, label, tag:tag || "",
    sub:tag ? mdOf(k) : `${mdOf(k)} (${WD[dowOf(k)]})`,
    groups:groupItems(itemsOn(plan, k)),
    night:(state.data.night && state.data.night[k]) || ""
  };
}
function buildView(n){
  const t = n.key, D = state.data;
  const plan = D.plan || { byDate:{}, dates:[] };
  /* 다음 칸: 내일이 시트에 있으면 내일, 없으면(주말·방학) 열흘 안의 다음 일정일, 그것도 없으면 다음 평일 */
  let nx = addDays(t, 1);
  if(!new Set(plan.dates).has(nx)){
    const later = plan.dates.find(k => k > t);
    nx = later && diffDays(t, later) <= 10 ? later : nextWeekday(t);
  }
  const tomorrow = nx === addDays(t, 1);
  const today = dayView(t, "오늘", plan);
  const bn = bellNow(n);
  today.bell = bn ? { no:bn.no, done:bn.done } : null;        /* 교시가 바뀌면 오늘 칸을 다시 그린다 */
  const next = dayView(nx, tomorrow ? "내일" : `${WD[dowOf(nx)]}요일`, plan, tomorrow ? "" : "다음 등교일");
  const notices = (D.notice || []).filter(x => (!x.from || t >= x.from) && (!x.to || t <= x.to));
  /* 이번 주 월~금. 주말이면 다가오는 주를 보여 준다 */
  const dow = dowOf(t);
  const mon = dow === 0 ? addDays(t, 1) : dow === 6 ? addDays(t, 2) : addDays(t, 1 - dow);
  const week = [0, 1, 2, 3, 4].map(i => {
    const k = addDays(mon, i), p = D.pray && D.pray[k];
    return { key:k, wd:WD[dowOf(k)], md:mdOf(k).replace("/", "."), name:(p && p.name) || "", st:k < t ? "past" : k === t ? "now" : "future" };
  });
  const p = (D.pray && D.pray[t]) || null;
  const w = p && words[wordKey(p)];
  return {
    today, next, notices, week, pray:p, roster:D.roster,
    weekTitle:dow === 0 || dow === 6 ? "다음 주 기도" : "이번 주 기도",
    worship:worshipNow(n) && p && (p.hymn || p.bible)
      ? { hymn:p.hymn || "", bible:p.bible || "", name:p.name || "", lyrics:(w && w.lyrics) || [], verses:(w && w.verses) || [] }
      : null
  };
}

/* ============ 그리기 ============ */
const last = {};                       /* 칸마다 마지막으로 그린 내용 — 같으면 다시 그리지 않아 쪽 넘김이 끊기지 않는다 */
const pagers = new Map();
const changed = (k, v) => { const s = JSON.stringify(v); if(last[k] === s) return false; last[k] = s; return true; };

function evRow(g, bell){
  const li = el("li", "ev");
  const ps = bell ? [...new Set(g.vars.flatMap(v => v.periods))] : [];
  if(bell && bell.no && ps.includes(bell.no)) li.classList.add("now");
  else if(ps.length && Math.max(...ps) <= bell.done) li.classList.add("past");
  const name = g.dept || "기타";
  const chip = el("span", "chip" + (name.length >= 7 ? " l7" : name.length === 6 ? " l6" : name.length === 5 ? " l5" : ""), name);
  chip.style.cssText = tone(g.dept);

  const tags = [], seen = new Set();
  for(const v of g.vars){
    const l = varLabel(v);
    if(l && !seen.has(l)){ seen.add(l); tags.push(el("i", "tg" + (bell && bell.no && v.periods.includes(bell.no) ? " now" : ""), l)); }
  }
  /* 태그가 혼자 다음 줄로 떨어지지 않게 마지막 낱말과 첫 태그를 한 덩어리로 묶는다 */

  else body.append(g.text);
  for(const t of tags) body.append(t);
  li.append(el("span", "cb", chip), body);
  return li;
}

/* 머리의 '지금' 배지 */
function paintNowPill(n){
  let text = "", live = false;
  if(worshipNow(n)){ text = "아침 예배 시간"; live = true; }
  else{
    const b = bellNow(n);
    if(b && b.cur >= 0){
      const x = BELL[b.cur];
      text = `${x.name}${x.no ? " 수업 중" : "시간"} · ${x.b - b.m}분 남음`; live = true;
    }else if(b && b.soon >= 0 && BELL[b.soon].a - b.m <= 40){
      const x = BELL[b.soon];
      text = `${b.m < BELL[0].a ? "등교" : "쉬는 시간"} · ${x.name} ${x.a - b.m}분 전`;
    }else if(b && b.m >= BELL[BELL.length - 1].b && b.m < 21 * 60) text = "방과후 시간";
  }
  if(!changed("nowPill", [text, live])) return;
  const pill = $("#nowPill");
  pill.hidden = !text;
  pill.textContent = text;
  pill.classList.toggle("live", live);
}
/* 일과 줄. 보이고 안 보이는 것이 바뀌면 true (일정 칸 높이가 달라지므로 글자를 다시 맞춰야 한다) */
function paintBells(n){
  const b = bellNow(n), box = $("#bells"), on = !!(b && b.show);
  if(!changed("bells", on ? [b.m, b.cur, b.soon] : null)) return false;
  const was = box.hidden;
  box.hidden = !on;
  if(on){
    const kids = [];
    const seg = (cls, mins, ...inner) => { const e = el("div", "bell " + cls, ...inner); e.style.flexGrow = mins; return e; };
    let at = BELL[0].a;
    BELL.forEach((x, i) => {
      if(x.a > at) kids.push(seg("gap", x.a - at));
      const st = i === b.cur ? "now" : i === b.soon && x.a - b.m <= 30 ? "soon" : b.m >= x.b ? "past" : "";
      const note = st === "now" ? `${x.b - b.m}분 남음` : st === "soon" ? `${x.a - b.m}분 뒤` : clockMin(x.a);
      const e = seg((x.no ? "" : "rest ") + st, x.b - x.a, el("b", "", x.name), el("span", "", note));
      if(st === "now") e.style.setProperty("--p", (b.m - x.a) / (x.b - x.a) * 100 + "%");
      kids.push(e);
      at = Math.max(at, x.b);
    });
    box.replaceChildren(...kids);
  }
  return was !== box.hidden;
}
function paintDevotion(p){
  if(!changed("dv", p ? [p.hymn, p.bible] : null)) return false;
  const line = $("#dvLine"), hymn = p && hymnText(p.hymn), bible = p && p.bible;
  line.replaceChildren();
  if(hymn) line.append("찬송 ", el("b", "", hymn));
  if(hymn && bible) line.append(" · ");
  if(bible) line.append("성경 ", el("b", "", bible));
  return true;
}
function paintWeek(w, title){
  if(!changed("week", [w, title])) return false;
  $("#weekTitle").textContent = title;
  $("#week").replaceChildren(...w.map(x => el("div", "wk " + x.st, el("span", "d", `${x.wd} ${x.md}`), el("span", "n" + (x.name ? "" : " nil"), x.name || "—"))));
  return true;
}
/* 학년 × 반 표: 반 번호 칸이 학년마다 같은 자리에 온다 */
function paintRoster(r){
  if(!changed("roster", r)) return false;
  $("#stuTotal").textContent = r ? `총 ${r.total}명` : "";
  const rows = $("#stuRows");
  rows.replaceChildren();
  if(!r){ rows.style.setProperty("--n", 1); rows.append(el("span", "g", "자료 없음")); return true; }
  const n = Math.max(1, ...r.grades.map(g => g.classes.length));
  rows.style.setProperty("--n", n);
  rows.append(el("span", "gh", "학년"));
  for(let i = 0; i < n; i++){
    const sample = r.grades.map(g => g.classes[i]).find(Boolean);
    rows.append(el("span", "ch", `${sample ? sample.c : i + 1}반`));
  }
  rows.append(el("span", "th", "계"));
  for(const g of r.grades){
    rows.append(el("span", "g", `${g.g}학년`));
    for(let i = 0; i < n; i++) rows.append(el("span", "c", g.classes[i] ? g.classes[i].n : "—"));
    rows.append(el("b", "", g.total));
  }
  return true;
}

/* ── 글자 크기 맞추기: 넘치면 줄이고, 그래도 넘치면 쪽으로 나눠 돌려 보인다 ── */
/* 넘치지 않는 가장 큰 글자 크기 (하나도 안 맞으면 min, 안 보이는 칸이면 null) */
function bestSize(listEl, max, min){
  for(const li of listEl.children) li.hidden = false;
  if(listEl.clientHeight < 40) return null;
  const set = px => listEl.style.setProperty("--fs", px + "px");
  const over = () => listEl.scrollHeight > listEl.clientHeight + 1;
  set(max);
  if(!over()) return max;
  set(min);
  if(over()) return min;
  let lo = min, hi = max;
  while(hi - lo > 1){ const mid = (lo + hi) >> 1; set(mid); if(over()) hi = mid; else lo = mid; }
  return lo;
}
/* 정한 크기로 칸을 채우고, 그래도 넘치면(noPage 가 아니면) 쪽으로 나눠 돌려 보인다 */
function applyFit(listEl, fs, noPage){
  pagers.delete(listEl);
  const items = [...listEl.children];
  for(const li of items) li.hidden = false;
  const holder = listEl.closest("[data-pager]");
  const pg = holder && $(".pg", holder);
  if(pg) pg.textContent = "";
  listEl.classList.remove("flip");
  if(listEl.clientHeight < 40) return;
  listEl.style.setProperty("--fs", fs + "px");
  if(noPage || listEl.scrollHeight <= listEl.clientHeight + 1) return;
  if(items.length < 2 || items[0].classList.contains("empty")) return;
  const pages = [[]], H = listEl.clientHeight;
  let used = 0;
  for(const li of items){
    const h = li.offsetHeight;
    if(used + h > H + 1 && pages[pages.length - 1].length){ pages.push([]); used = 0; }
    pages[pages.length - 1].push(li); used += h;
  }
  const p = { pages, i:0, pg, every:+listEl.dataset.every || PAGE_MS, t:Date.now() };
  pagers.set(listEl, p);
  showPage(listEl, p);
}
function showPage(listEl, p){
  p.pages.forEach((arr, i) => arr.forEach(li => { li.hidden = i !== p.i; }));
  if(p.pg) p.pg.textContent = `${p.i + 1} / ${p.pages.length}`;
  listEl.classList.remove("flip"); void listEl.offsetWidth; listEl.classList.add("flip");
}
function nextPage(listEl){
  const p = pagers.get(listEl);
  if(!p || p.pages.length < 2) return;
  p.t = Date.now(); p.i = (p.i + 1) % p.pages.length;
  showPage(listEl, p);
}
function fitList(listEl, max, min, noPage){
  const s = bestSize(listEl, max, min);
  applyFit(listEl, s == null ? max : s, noPage);
}
/* 오늘은 칸이 넓은 만큼 크게, 내일은 그보다 작게. 내일이 오늘보다 커지지는 않는다. */
function fitDays(){
  const a = $("#list-today"), b = $("#list-next");
  const sa = bestSize(a, 68, 38), sb = bestSize(b, 52, 33);
  const fa = sa == null ? 68 : sa;
  applyFit(a, fa);
  applyFit(b, Math.min(sb == null ? 52 : sb, fa));
}
function fitWidth(node, max, min){
  node.style.fontSize = max + "px";
  if(node.scrollWidth <= node.clientWidth + 1) return;
  node.style.fontSize = min + "px";
  if(node.scrollWidth > node.clientWidth + 1) return;
  let lo = min, hi = max;
  while(hi - lo > 1){ const mid = (lo + hi) >> 1; node.style.fontSize = mid + "px"; if(node.scrollWidth > node.clientWidth + 1) hi = mid; else lo = mid; }
  node.style.fontSize = lo + "px";
}
/* 여러 글자를 한 줄씩 맞춘 뒤, 그중 가장 작은 크기로 모두 통일한다 (room: 칸에 딱 붙지 않게 남기는 여백 비율) */
function fitWidthAll(nodes, max, min, room = 1){
  let fs = max;
  for(const n of nodes){ fitWidth(n, max, min); fs = Math.min(fs, parseFloat(n.style.fontSize) || max); }
  fs = Math.max(min, Math.floor(fs * room));
  for(const n of nodes) n.style.fontSize = fs + "px";
}
function fitAll(){
  fitList($("#list-notice"), 42, 30);          /* 공지 띠 높이가 정해져야 일정 칸 높이도 정해진다 */
  fitDays();
  fitList($("#menu-lunch"), 40, 21, true);     /* 식단은 쪽으로 나누지 않고 한 칸에 */
  fitList($("#menu-dinner"), 40, 21, true);
  fitWidthAll($$("#week .n"), 42, 20, .92);
  fitWidth($("#dvLine"), 27, 17);
  if($("#stage").classList.contains("worship-on")){
    const hText = $("#w-hymn").classList.contains("has-text"), bText = $("#w-bible").classList.contains("has-text");
    fitWidth($("#w-hymn b"), hText ? 120 : 330, 60);       /* 머리(번호)를 먼저 맞춰야 글이 들어갈 높이가 정해진다 */
    fitWidth($("#w-bible b"), bText ? 100 : 196, 44);
    fitList($("#w-hymn-text"), 60, 16, true);              /* 가사는 한 화면에, 본문은 넘치면 쪽으로 */
    fitList($("#w-bible-text"), 60, 38);
  }
}
/* 기준은 1920 × 1080. 화면 비율에 따라 높이(900~1240)나 너비(~2560)를 늘려 칸을 채우고, 그래도 남으면 가운데에 둔다. */
function layout(){
  const fit = $("#fit"), stage = $("#stage");
  const vw = fit.clientWidth, vh = fit.clientHeight;
  if(vw <= 0 || vh <= 0) return;
  const ratio = vw / vh;
  const W = ratio > 1920 / 900 ? Math.min(2560, 900 * ratio) : 1920;
  const H = ratio > 1920 / 900 ? 900 : Math.min(1240, 1920 / ratio);
  const k = Math.min(vw / W, vh / H);
  stage.style.width = W + "px";
  stage.style.height = H + "px";
  stage.style.transform = `translate(${(vw - W * k) / 2}px,${(vh - H * k) / 2}px) scale(${k})`;
  fitAll();
  syncFs();
}

  if(state.demo){ dot.className = "dot warn"; txt.textContent = "예시 자료를 보여 주는 중입니다 (?demo)"; ov.hidden = true; return; }
  if(!state.data.plan){

    if(!state.tried) ov.replaceChildren(el("b", "", "자료를 불러오는 중…"));
    else ov.replaceChildren(
      el("b", "", "자료를 불러오지 못했습니다"),
      el("p", "", offline ? "인터넷 연결이 끊겨 있습니다. 연결되면 바로 다시 불러옵니다."
                          : "인터넷 연결과 구글 시트 공유 설정(링크가 있는 모든 사용자 · 뷰어)을 확인해 주세요. 자동으로 다시 시도합니다."),
      el("small", "", errs.map(t => `${t.name}: ${state.src[t.key].error}`).join("  ·  "))
    );
    dot.className = "dot err"; txt.textContent = state.tried ? "연결되지 않았습니다" : "불러오는 중…";
    return;
  }
  ov.hidden = true;
  const age = Date.now() - state.loadedAt;
  if(offline || errs.length === TABS.length){
    dot.className = "dot err";
    txt.textContent = `${offline ? "인터넷 연결이 끊겨" : "연결되지 않아"} ${clockOf(state.loadedAt)} 저장본을 보여 줍니다`;
  }else if(errs.length){
    dot.className = "dot warn";
    txt.textContent = "일부 자료를 받지 못했습니다 — " + errs.map(t => `${t.name}(${state.src[t.key].error})`).join(", ");
  }else if(age > STALE_MS){
    dot.className = "dot warn";
    txt.textContent = `갱신이 ${Math.floor(age / 60e3)}분째 멈춰 있습니다 (마지막 ${clockOf(state.loadedAt)})`;
  }else{
    dot.className = "dot";
    txt.textContent = `${clockOf(state.loadedAt)} 갱신 · 5분마다 자동 갱신`;
  }
}

/* ============ 찬송 가사 · 성경 본문 (아침 예배 화면에서 쓴다) ============ */
/* 같은 시트의 '찬송가 가사', '성경 말씀' 탭을 이름으로 조회한다. 못 받으면 번호만 보인다. */
const wordSaved = store.get(WORD_KEY);
const words = (wordSaved && wordSaved.sheet === SHEET_ID && wordSaved.words) || {};   /* "찬송|성경" → { at, lyrics, verses, lOk, vOk } */
const wordBusy = new Set();
const wordKey = p => `${p.hymn || ""}|${p.bible || ""}`;
/* "요한복음 8:12", "시 23:1-6" → 책·장·절 범위 */
function parseRef(t){
  const m = String(t || "").match(/^\s*([가-힣]+\d?[가-힣]*)\s*(\d+)\s*(?:[:：]|장)\s*(\d+)\s*절?\s*(?:[-~–]\s*(\d+)\s*절?)?/);
  if(!m) return null;
  const from = +m[3];
  return { book:m[1], ch:+m[2], from, to:Math.min(Math.max(m[4] ? +m[4] : from, from), from + 40) };
}
/* "(1)…\n(2)…" → 절 단위 */
function splitLyrics(v){
  return String(v || "").replace(/\r/g, "").split(/\s*(?=[(]\d+[)])/).map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^[(](\d+)[)]\s*([\s\S]*)$/);
    return { n:m ? m[1] : "", t:(m ? m[2] : x).replace(/\s+/g, " ").trim() };
  }).filter(x => x.t);
}
const sq = s => String(s).replace(/'/g, "");   /* 시트 질의문에 넣는 글자에서 따옴표를 뺀다 */
async function fetchWord(p){
  const out = { at:Date.now(), lyrics:[], verses:[], lOk:true, vOk:true };
  const r = parseRef(p.bible), hn = (String(p.hymn || "").match(/\d{1,3}/) || [])[0];
  const jobs = [];
  if(r) jobs.push(gviz(TAB.bible, `select C, D, E where (A = '${sq(r.book)}' or B = '${sq(r.book)}') and C = ${r.ch} and D >= ${r.from} and D <= ${r.to} order by D`)
    .then(t => { out.verses = t.rows.map(x => ({ n:cText(x.c && x.c[1]), t:cText(x.c && x.c[2]) })).filter(x => x.t); })
    .catch(() => { out.vOk = false; }));
  if(hn) jobs.push(gviz(TAB.hymn, `select A, B where A = ${hn}`)
    .catch(() => gviz(TAB.hymn, `select A, B where A = '${hn}'`))       /* 번호 칸이 글자로 저장된 경우 */
    .then(t => { out.lyrics = splitLyrics(cText(t.rows[0] && t.rows[0].c && t.rows[0].c[1])); })
    .catch(() => { out.lOk = false; }));
  await Promise.all(jobs);
  return out;
}
/* 오늘 찬송·성경을 미리 받아 둔다. 못 받으면 다음 갱신 때 다시 해 본다. */
function ensureWord(){
  if(state.demo) return;
  const p = state.data.pray && state.data.pray[now().key];
  if(!p || !(p.hymn || p.bible)) return;
  const k = wordKey(p), have = words[k];
  if(have && have.lOk && have.vOk) return;
  if(wordBusy.has(k) || (have && Date.now() - have.at < 60e3)) return;
  wordBusy.add(k);
  fetchWord(p).then(w => {
    words[k] = w;
    for(const old of Object.keys(words).sort((a, b) => words[b].at - words[a].at).slice(12)) delete words[old];
    store.set(WORD_KEY, { sheet:SHEET_ID, words });
    render();
  }).catch(e => console.warn("word", e && e.message)).finally(() => wordBusy.delete(k));
}

/* ============ 날씨 (Open-Meteo) ============ */
/* WMO 날씨 코드 → [그림, 글자] */
function wxKind(c){
  if(c === 0) return ["sun", "맑음"];
  if(c === 1) return ["sun", "대체로 맑음"];
  if(c === 2) return ["partly", "구름 조금"];
  if(c === 3) return ["cloud", "흐림"];
  if(c === 45 || c === 48) return ["fog", "안개"];
  if(c >= 51 && c <= 57) return ["rain", "이슬비"];
  if(c >= 61 && c <= 67) return ["rain", "비"];
  if((c >= 71 && c <= 77) || c === 85 || c === 86) return ["snow", "눈"];
  if(c >= 80 && c <= 82) return ["rain", "소나기"];
  if(c >= 95) return ["storm", "뇌우"];
  return ["cloud", "흐림"];
}
const num = v => typeof v === "number" && Number.isFinite(v) ? v : null;
function paintWeather(){
  const w = state.wx, show = !!w && Date.now() - w.at < WEATHER.stale;
  if(!changed("wx", show ? [w.t, w.code, w.hi, w.lo, w.pop] : null)) return;
  $("#wx").hidden = !show;
  if(!show) return;
  const [icon, label] = wxKind(w.code);
  $("#wxUse").setAttribute("href", "#wx-" + icon);
  $("#wxNow").textContent = `${w.t}°`;
  $("#wxCond").textContent = label;
  $("#wxRange").textContent = w.hi != null && w.lo != null ? `${w.lo}° / ${w.hi}°` : "";
  $("#wxPop").textContent = w.pop != null ? `강수 ${w.pop}%` : "";
}
let wxTimer = null;
async function fetchWeather(){
  clearTimeout(wxTimer);
  const ctl = new AbortController(), kill = setTimeout(() => ctl.abort(), 10e3);
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER.lat}&longitude=${WEATHER.lon}`
      + "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"
      + "&timezone=Asia%2FSeoul&forecast_days=1";
    const r = await fetch(url, { signal:ctl.signal, cache:"no-store" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(), c = j.current || {}, d = j.daily || {};
    const t = num(c.temperature_2m), code = num(c.weather_code != null ? c.weather_code : c.weathercode);
    if(t == null || code == null) throw new Error("날씨 응답 모양이 다릅니다");
    const rd = v => { const x = num(Array.isArray(v) ? v[0] : null); return x == null ? null : Math.round(x); };
    state.wx = { t:Math.round(t), code, hi:rd(d.temperature_2m_max), lo:rd(d.temperature_2m_min), pop:rd(d.precipitation_probability_max), at:Date.now() };
  }catch(e){ console.warn("weather", e && e.message); }        /* 날씨는 덤이다: 실패하면 조용히 넘어가고, 묵은 값은 paintWeather 가 숨긴다 */
  finally{ clearTimeout(kill); try{ paintWeather(); }catch(e){ console.error(e); } wxTimer = setTimeout(fetchWeather, WEATHER.every); }
}

/* ============ 급식 (나이스) ============ */
/* 오늘 남은 끼니. 다 지났거나 없으면(주말·방학) 다음 급식일 것을 보인다. */
const NEIS = "https://open.neis.go.kr/hub/";
async function neis(service, params){
  const ctl = new AbortController(), kill = setTimeout(() => ctl.abort(), 12e3);
  try{
    const q = new URLSearchParams({ Type:"json", pIndex:"1", pSize:"10", ATPT_OFCDC_SC_CODE:SCHOOL.office, ...params });
    const r = await fetch(NEIS + service + "?" + q, { signal:ctl.signal, cache:"no-store" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(), body = j[service];
    if(!body){                                                     /* 자료 없음은 { RESULT:{ CODE:"INFO-200" } } 로 온다 */
      const code = j.RESULT && j.RESULT.CODE;
      if(code === "INFO-200") return [];
      throw new Error(code || "응답 모양이 다릅니다");
    }
    return (body.find(x => x.row) || {}).row || [];
  }finally{ clearTimeout(kill); }
}
/* 0: 점심 전 · 1: 점심 뒤 · 2: 저녁 뒤 */
const mealStage = n => { const m = n.hh * 60 + n.mm; return m >= toMin(MEAL.dinnerEnd) ? 2 : m >= toMin(MEAL.lunchEnd) ? 1 : 0; };
const ymdOf = k => k.replace(/-/g, "");
const keyOfYmd = y => `${y.slice(0, 4)}-${y.slice(4, 6)}-${y.slice(6, 8)}`;
/* "현미밥 (5.)<br/>쇠고기미역국 (5.6.16.)" → ["현미밥", "쇠고기미역국"] */
function dishes(v){
  return String(v || "").split(/<br\s*\/?>|\n/i).map(x => x
    .replace(/[(]\s*[\d.,\s]+[)]/g, "")          /* 알레르기 번호 */
    .replace(/(\D)[\d.]+\s*$/, "$1")             /* 괄호 없이 붙은 번호 */
    .replace(/[*#]+/g, "").replace(/\s+/g, " ").trim()).filter(Boolean);
}
async function schoolCode(){
  const c = store.get(SCHOOL_KEY);
  if(c && c.name === SCHOOL.name && c.office === SCHOOL.office && c.sd) return c.sd;
  const rows = await neis("schoolInfo", { SCHUL_NM:SCHOOL.name });
  const row = rows.find(r => r.SCHUL_NM === SCHOOL.name) || rows[0];
  if(!row || !row.SD_SCHUL_CODE) throw new Error("학교를 찾지 못했습니다");
  store.set(SCHOOL_KEY, { name:SCHOOL.name, office:SCHOOL.office, sd:row.SD_SCHUL_CODE });
  return row.SD_SCHUL_CODE;
}
let mealTimer = null;
async function fetchMeal(){
  clearTimeout(mealTimer);
  try{
    const sd = await schoolCode(), n = now(), t = n.key, st = mealStage(n);
    const left = r => { const nm = String(r.MMEAL_SC_NM || ""); return (st < 1 && nm.includes("중식")) || (st < 2 && nm.includes("석식")); };
    let rows = st < 2 ? await neis("mealServiceDietInfo", { SD_SCHUL_CODE:sd, MLSV_YMD:ymdOf(t) }) : [];
    if(!rows.some(left)) rows = await neis("mealServiceDietInfo", { SD_SCHUL_CODE:sd, MLSV_FROM_YMD:ymdOf(addDays(t, 1)), MLSV_TO_YMD:ymdOf(addDays(t, 14)), pSize:"40" });
    const day = rows.map(r => String(r.MLSV_YMD || "")).filter(y => /^\d{8}$/.test(y)).sort()[0];
    const pick = name => {
      const r = rows.find(x => x.MLSV_YMD === day && String(x.MMEAL_SC_NM || "").includes(name));
      if(!r) return null;
      const d = dishes(r.DDISH_NM), kcal = (String(r.CAL_INFO || "").match(/[\d.]+/) || [])[0];
      return d.length ? { dishes:d, kcal:kcal ? Math.round(+kcal) : null } : null;
    };
    state.meal = day ? { date:keyOfYmd(day), lunch:pick("중식"), dinner:pick("석식"), at:Date.now() } : { date:t, lunch:null, dinner:null, at:Date.now() };
    store.set(MEAL_KEY, state.meal);
  }catch(e){ console.warn("meal", e && e.message); }
  finally{ try{ render(); }catch(e){ console.error(e); } mealTimer = setTimeout(fetchMeal, MEAL.every); }
}
/* 지난 날짜의 저장본은 쓰지 않고, 오늘 것이라도 이미 지난 끼니는 내린다 */
function mealFor(m){
  const n = now();
  if(!m || m.date < n.key) return null;
  if(m.date > n.key) return m;
  const st = mealStage(n);
  return st ? { ...m, lunch:null, dinner:st >= 2 ? null : m.dinner } : m;
}
function paintMeal(raw){
  const m = mealFor(raw);
  if(!changed("meal", m)) return false;
  for(const slot of ["lunch", "dinner"]){
    const x = m && m[slot];
    $("#menu-" + slot).replaceChildren(...(x ? x.dishes.map(d => el("span", "dish", d)) : []));
  }
  rotSync(m);
  return true;
}
/* 남은 끼니가 둘이면 중식 ↔ 석식을 번갈아 보인다 */
const rot = { phases:[], i:0, t:Date.now() };
function rotSync(m){
  const ph = [];
  if(m && m.lunch) ph.push("lunch");
  if(m && m.dinner) ph.push("dinner");
  const cur = rot.phases[rot.i], t = now().key;
  rot.phases = ph;
  rot.i = Math.max(0, ph.indexOf(cur));
  $("#mealTabs").replaceChildren(...(ph.length ? ph.map((p, idx) => {
    const tb = el("span", "tab", p === "lunch" ? "중식" : "석식");
    tb.dataset.i = idx;
    return tb;
  }) : [el("span", "tab", "급식")]));
  $("#mealWhen").textContent = !ph.length ? "" : m.date === t ? "오늘" : m.date === addDays(t, 1) ? "내일" : `${mdOf(m.date)} (${WD[dowOf(m.date)]})`;
  $("#mealNone").hidden = ph.length > 0;
  setPhase();
}
function setPhase(){
  const ph = rot.phases[rot.i] || "";
  $("#menu-lunch").classList.toggle("on", ph === "lunch");
  $("#menu-dinner").classList.toggle("on", ph === "dinner");
  $$("#mealTabs .tab").forEach((d, i) => d.classList.toggle("on", i === rot.i && !!ph));
  const m = mealFor(state.meal), x = m && m[ph];
  $("#mealKcal").textContent = x && x.kcal ? `${x.kcal} kcal` : "";
}
function rotTick(){
  if(rot.phases.length < 2 || Date.now() - rot.t < MEAL.rotate - 50) return;
  rot.t = Date.now();
  rot.i = (rot.i + 1) % rot.phases.length;
  setPhase();
}

/* ============ 불러오기 ============ */
let timer = null, fails = 0;
async function refresh(){
  clearTimeout(timer);
  let bad = TABS.length;
  try{
    const res = await Promise.allSettled(TABS.map(t => gviz(t.sheet)));
    bad = 0;
    res.forEach((r, i) => {
      const t = TABS[i], s = state.src[t.key];
      try{
        if(r.status !== "fulfilled") throw r.reason;
        state.data[t.key] = PARSERS[t.key](r.value);
        s.at = Date.now(); s.error = "";
      }catch(e){ s.error = String((e && e.message) || e).slice(0, 60); bad++; }
    });
    state.tried = true;
    if(bad < TABS.length){ state.loadedAt = Date.now(); saveCache(); }
    fails = bad ? fails + 1 : 0;
    render();
    ensureWord();
  }catch(e){ console.error("refresh", e); }
  finally{ timer = setTimeout(refresh, bad ? RETRY_MS[Math.min(Math.max(fails, 1) - 1, RETRY_MS.length - 1)] : POLL_MS); }  /* 어떤 경우에도 다음 차례는 잡는다 */
}
/* 페이지를 다시 열지 않고 자료와 화면을 새로 고친다 (전체화면이 풀리지 않는다) */

/* ============ 전체화면 ============ */
/*
  웹 페이지는 사람이 누르기 전에는 스스로 전체화면이 될 수 없다(브라우저 보안 규칙). 그래서 세 겹으로 한다.
    ① 키오스크 실행: kiosk/ 폴더의 실행 파일로 브라우저를 키오스크(전체화면) 창으로 띄운다. 창 자체가 전체화면이라 이 코드는 할 일이 없다.
    ② 자동 전체화면 허용 정책: kiosk/ 의 정책 파일로 이 주소에 '누르지 않아도 전체화면'을 허용하면, 아래 enterFs() 가 열자마자 성공한다.
    ③ 둘 다 없으면: 화면을 처음 누르거나(마우스·터치) 키를 누르는 순간 전체화면으로 바꾼다. 그때까지 안내를 잠깐 보인다.
  사람이 Esc 로 전체화면을 끄면 그 뜻을 따르되, 10분 동안 아무도 만지지 않으면 다시 전체화면을 바란다(②가 있으면 저절로 돌아간다).
*/
const FS = { want:true, wasDoc:false, enteredAt:0, granted:false, blocked:false, touchedAt:Date.now() };
const fsMedia = window.matchMedia ? matchMedia("(display-mode: fullscreen)") : { matches:false };
const docFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
/* 창 자체가 전체화면인가 (키오스크 · F11 · 전체화면 앱). 화면 확대 비율이 100% 가 아니어도 알아본다 */
function windowFs(){
  if(docFs()) return false;
  if(fsMedia.matches) return true;
  const sw = screen.width, sh = screen.height;
  if(Math.abs(innerWidth - sw) <= 4 && Math.abs(innerHeight - sh) <= 4) return true;
  if(!outerWidth || !innerWidth) return false;
  const z = outerWidth / innerWidth;
  return Math.abs(outerWidth - sw) <= 2 && Math.abs(outerHeight - sh) <= 2 && Math.abs(innerHeight * z - outerHeight) <= 3;
}
const isFs = () => docFs() || windowFs();
function requestFs(){
  const root = document.documentElement, fn = root.requestFullscreen || root.webkitRequestFullscreen;
  if(!fn) return Promise.reject(new Error("이 브라우저는 전체화면을 지원하지 않습니다"));
  try{
    const p = fn.call(root, { navigationUI:"hide" });
    return p && typeof p.then === "function" ? p : Promise.resolve();
  }catch(e){ return Promise.reject(e); }
}
/* 전체화면을 청한다. 막히면 안내를 띄울 수 있게 표시해 둔다.
   정책으로 허용된 브라우저도 전체화면이 풀린 직후(페이지를 새로 열 때 등) 몇 초는 거절하므로, 그때는 간격을 늘려 가며 다시 청한다 */
let fsRetry = null, fsRetryDelay = 1000;
function enterFs(){
  clearTimeout(fsRetry);
  if(!FS.want || isFs()){ fsRetryDelay = 1000; return Promise.resolve(syncFs()); }
  return requestFs().then(() => { FS.blocked = false; fsRetryDelay = 1000; syncFs(); }, () => {
    FS.blocked = true; syncFs();
    if(FS.granted){ fsRetry = setTimeout(enterFs, fsRetryDelay); fsRetryDelay = Math.min(fsRetryDelay * 2, 15e3); }
  });
}
function syncFs(){
  const d = docFs(), full = d || windowFs();
  if(d && !FS.wasDoc) FS.enteredAt = Date.now();
  if(FS.wasDoc && !d){
    if(Date.now() - FS.enteredAt > 3000) FS.want = false;   /* 사람이 Esc 등으로 빠져나왔다: 그 뜻을 따른다 */
    else fsRetry = setTimeout(enterFs, 1000);                /* 들어가자마자 풀렸다: 사람 뜻이 아니니 다시 */
  }
  FS.wasDoc = d;
  const btn = $("#btnFs");
  btn.hidden = full && !d;                      /* 키오스크처럼 창이 전체화면이면 이 단추로 끌 수 없으니 감춘다 */
  btn.textContent = d ? "창으로" : "전체화면";
  document.body.classList.toggle("fs-need", !full && FS.want && FS.blocked);
}
function toggleFs(){
  if(docFs()){
    FS.want = false;
    const fn = document.exitFullscreen || document.webkitExitFullscreen;
    Promise.resolve(fn && fn.call(document)).catch(() => {}).then(syncFs);
  }else if(windowFs()){
    toast("브라우저 전체화면입니다 · F11 로 끄고, 키오스크 창은 Alt+F4 로 닫습니다");
  }else{
    FS.want = true;
    requestFs().then(syncFs, () => { FS.blocked = true; syncFs(); toast("이 브라우저가 전체화면을 막았습니다 · F11 을 눌러 주세요"); });
  }
}
/* 사람이 누르거나 키를 누르는 순간이 전체화면으로 바꿀 수 있는 기회다 */
function gesture(){
  FS.touchedAt = Date.now();
  if(FS.want && !isFs()) requestFs().then(() => { FS.blocked = false; syncFs(); }, () => syncFs());
}
if(navigator.permissions && navigator.permissions.query){
  /* 정책으로 '누르지 않아도 전체화면'이 허용됐는지 (②). 허용이면 통째로 새로 열어도 전체화면으로 돌아온다 */
  navigator.permissions.query({ name:"fullscreen", allowWithoutGesture:true }).then(st => {
    const up = () => { FS.granted = st.state === "granted"; if(FS.granted) enterFs(); };
    up(); st.onchange = up;
  }).catch(() => {});
}

/* ============ 시계 · 하루 한 번 새로 열기 · 화면 꺼짐 막기 ============ */
let dayKey = "", reloading = false, lastWorship = null, lastMeal = null, lastBell = "";
async function nightlyReload(){
  if(reloading) return;
  reloading = true;
  try{
    /* 정책 없이 누름으로 들어간 전체화면은 페이지를 다시 열면 풀리고, 새벽에는 다시 눌러 줄 사람이 없다.
       그럴 때는 페이지를 다시 열지 않고 자료와 화면만 새로 고친다. */
    if(docFs() && !FS.granted){ await softReload(true); setTimeout(() => { reloading = false; }, 70e3); return; }
    /* 인터넷이 안 될 때 다시 열면 오류 화면이 뜰 수 있으니 확인부터 한다 */
    if(location.protocol !== "file:"){
      const r = await fetch(location.href.split("#")[0], { method:"HEAD", cache:"no-store" });
      if(!r.ok) throw new Error(r.status);
    }
    location.reload();
  }catch{ reloading = false; }
}
let wakeLock = null;
async function keepAwake(){
  if(wakeLock || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  try{
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  }catch{}
}
function tick(){
  setTimeout(tick, 1000 - (Date.now() % 1000) + 8);     /* 다음 차례를 먼저 잡아 둔다: 아래에서 오류가 나도 시계는 계속 간다 */
  try{ tickBody(); }catch(e){ console.error("tick", e); }
}
function tickBody(){
  const n = now(), real = kstParts(), dow = dowOf(n.key);
  $("#hh").textContent = pad(n.hh);
  $("#mm").textContent = pad(n.mm);
  $("#dmd").textContent = `${n.m}월 ${n.d}일`;
  const wd = $("#dwd");
  wd.textContent = `${WD[dow]}요일`;
  wd.className = "wd" + (dow === 6 ? " sat" : dow === 0 ? " sun" : "");
  paintNowPill(n);
  const wOn = worshipNow(n), ms = mealStage(n), bn = bellNow(n), bk = bn ? `${bn.no}/${bn.done}` : "";
  const bellsMoved = paintBells(n);
  if(n.key !== dayKey || wOn !== lastWorship || ms !== lastMeal || bk !== lastBell){
    const newDay = n.key !== dayKey, mealTurn = lastMeal != null && ms !== lastMeal;      /* 끼니 때가 지나면 다음 급식을 받아 온다 */
    if(newDay) ensureWord();
    if(!state.demo && MEAL.on && ((newDay && dayKey) || mealTurn)) fetchMeal();
    dayKey = n.key; lastWorship = wOn; lastMeal = ms; lastBell = bk;
    render();
  }
  if(bellsMoved) fitAll();
  if(real.ss === 0){                            /* 1분에 한 번 (미리보기로 시각을 고정해도 실제 시계로 센다) */
    paintStatus();
    keepAwake();
    /* 10분 동안 아무도 만지지 않았으면 다시 전체화면을 바란다 */
    if(!FS.want && Date.now() - FS.touchedAt > 10 * 60e3){ FS.want = true; enterFs(); }
    else if(FS.want && FS.granted && !isFs()) enterFs();
  }
  /* 하루 한 번(설정한 시각에), 6시간 넘게 켜져 있었으면 새로 연다. 그날 한 번만 해 본다 */
  const rk = ymd(real.y, real.m, real.d);
  if(`${pad(real.hh)}:${pad(real.mm)}` === NIGHTLY && nightlyDone !== rk && performance.now() > 6 * 3600e3){ nightlyDone = rk; nightlyReload(); }
}
let nightlyDone = "";

/* ============ 예시 자료 (?demo) — 이름은 모두 지어낸 것이다 ============ */
function demoData(){
  const n = now(), t = n.key, nx = nextWeekday(t);
  const plan = { byDate:{}, dates:[] };
  const put = (k, lines) => { plan.dates.push(k); plan.byDate[k] = lines.map(s => parseItem(s, k)); };

    "[기획위원]부장회의(6,7)", "[2학년부]<자율>학급 활동(②,6-7)", "[2학년부]<자율>학급 활동(③,7)", "[상담부]집단상담(②, ~13일)"

    roster:{ grades, total:grades.reduce((a, g) => a + g.total, 0) }

  wake();
  const k = e.key;
  /* 누름으로 들어간 전체화면에서 F5 · Ctrl+R 은 페이지를 다시 열지 않고 새로 고친다 (다시 열면 전체화면이 풀린다) */
  if((k === "F5" || ((e.ctrlKey || e.metaKey) && !e.shiftKey && /^r$/i.test(k))) && docFs() && !FS.granted){
    e.preventDefault(); softReload(false); return;
  }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^f$/i.test(k)){ FS.touchedAt = Date.now(); toggleFs(); }
  else if(/^w$/i.test(k)) toggleWorship();
  else if(/^r$/i.test(k)) softReload(false);
  /* 그 밖의 글자 · Enter · 방향 키(리모컨 확인 단추 포함): 전체화면 기회. F11 같은 기능 키는 브라우저가 처리하게 둔다 */
  else if(k.length === 1 || k === "Enter" || k.startsWith("Arrow")) gesture();
});
document.addEventListener("fullscreenchange", syncFs);
document.addEventListener("webkitfullscreenchange", syncFs);
if(fsMedia.addEventListener) fsMedia.addEventListener("change", syncFs);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible") return;
  keepAwake();
  enterFs();
  if(!state.demo && Date.now() - state.loadedAt > 2 * 60e3) refresh();
  if(!state.demo && WEATHER.on && (!state.wx || Date.now() - state.wx.at > WEATHER.every)) fetchWeather();
});
addEventListener("online", () => { paintStatus(); if(!state.demo) softReload(true); });
addEventListener("offline", paintStatus);

$("#fsHint").addEventListener("click", e => { if(!e.target.closest("#fsHintClose")) gesture(); });
$("#fsHintClose").addEventListener("click", e => { e.stopPropagation(); FS.want = false; FS.touchedAt = Date.now(); syncFs(); });
$("#btnFs").addEventListener("click", () => { FS.touchedAt = Date.now(); toggleFs(); });
$("#btnWorship").addEventListener("click", toggleWorship);
$("#dvLine").addEventListener("click", toggleWorship);
$("#btnReload").addEventListener("click", () => softReload(false));
$("#btnDemoTime").addEventListener("click", toggleDemoTime);
$("#mealTabs").addEventListener("click", e => {
  const tb = e.target.closest(".tab[data-i]");
  if(!tb) return;
  rot.i = +tb.dataset.i; rot.t = Date.now(); setPhase();
});
/* 쪽 번호를 누르면 바로 다음 쪽 */
for(const holder of $$("[data-pager]")){
  const pg = $(".pg", holder), listEl = $(".list", holder);
  if(pg && listEl) pg.addEventListener("click", () => nextPage(listEl));
}
if(document.fonts){
  document.fonts.addEventListener("loadingdone", () => fitAll());
  document.fonts.ready.then(() => fitAll());
}
setInterval(() => {
  const t = Date.now();
  for(const [l, p] of pagers) if(p.pages.length > 1 && t - p.t >= p.every - 50){ p.t = t; p.i = (p.i + 1) % p.pages.length; showPage(l, p); }
  try{ rotTick(); }catch(e){ console.error("rot", e); }
}, 1000);

/* ============ 시작 ============ */
$("#schoolCode").textContent = SCHOOL.code ? `학교코드 ${SCHOOL.code}` : "";
if(forceWorship) $("#btnWorship").textContent = "평소 화면으로";
wake(); keepAwake();
layout();
tick();
/* 열자마자 전체화면을 청한다. 막히면 안내를 12초 보이고, 그 뒤에는 마우스를 움직일 때만 보인다 */
document.body.classList.add("fs-fresh");
setTimeout(() => document.body.classList.remove("fs-fresh"), 12e3);
enterFs();
addEventListener("load", enterFs, { once:true });

if(Q.has("demo")){
  state.demo = true;
  $("#btnDemoTime").hidden = false;
  if(FAKE.time) $("#btnDemoTime").textContent = "지금 시각으로";
  state.data = demoData();
  state.wx = { t:18, code:2, hi:22, lo:11, pop:20, at:Date.now() };
  words["430|요한복음 8:12"] = {
    at:Date.now(), lOk:true, vOk:true,
    lyrics:[1, 2, 3].map(i => ({ n:String(i), t:`예시 가사 ${i}절입니다. 이 글은 화면 모양을 보여 주기 위한 가짜 가사이며 실제 가사는 시트의 찬송가 가사 탭에서 불러옵니다.` })),
    verses:[{ n:"12", t:"예시 본문입니다. 이 글은 화면 모양을 보여 주기 위한 가짜 문장이며 실제 본문은 시트의 성경 말씀 탭에서 불러옵니다." }]
  };
  state.meal = { date:mealStage(now()) >= 2 ? addDays(now().key, 1) : now().key, at:Date.now(),
    lunch:{ dishes:["현미밥", "쇠고기미역국", "닭갈비", "도토리묵무침", "배추김치", "요구르트"], kcal:812 },
    dinner:{ dishes:["카레라이스", "유부장국", "돈가스", "양배추샐러드", "깍두기"], kcal:905 } };
  render();
}else{
  loadCache();
  state.meal = store.get(MEAL_KEY) || null;
  render();
  refresh();
  if(WEATHER.on) fetchWeather();
  if(MEAL.on) fetchMeal();
}

/* 인터넷이 잠깐 끊긴 채 켜져도 화면이 뜨도록 앱 파일을 기기에 보관한다 (sw.js) */
if("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) && !Q.has("nosw")){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e && e.message)));
}
</script>
</body>
